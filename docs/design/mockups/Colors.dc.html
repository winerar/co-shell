<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Цвет счёта</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
:root{
--spatial:linear(0,0.06 2.4%,0.22 5.3%,0.5 10.5%,0.74 16%,0.89 21.5%,0.97 27%,1.01 33%,1.02 40%,1.01 50%,1);
--bouncy:linear(0,0.009,0.035 2.1%,0.141,0.281 6.7%,0.723 12.9%,0.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,0.991,0.977 51%,0.974 53.8%,0.975 57.1%,0.997 69.8%,1.003 76.9%,1);
}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tap{transition:transform 520ms var(--bouncy),border-color 260ms ease-out,box-shadow 260ms ease-out,background-color 260ms ease-out}
.tap:active{transform:scale(0.9);transition:transform 80ms ease-out}
.tint{transition:background-color 420ms ease-out,border-color 420ms ease-out,color 420ms ease-out}
</style>
</helmet>
<div style="width: 390px; height: 1240px; box-sizing: border-box; background: #11170E; font-family: Onest, system-ui, sans-serif; color: #EEF5E6; padding: 12px 16px 24px; border-radius: 28px 28px 0 0;">
  <div style="display: flex; justify-content: center; padding-bottom: 12px;"><div style="width: 36px; height: 4px; border-radius: 2px; background: #4A5444;"></div></div>
  <h1 style="margin: 0 0 12px; font-size: 22px; font-weight: 700;">Цвет счёта</h1>

  <div class="tint" style="{{cardStyle}}">
    <span style="display: flex; align-items: center; gap: 12px;">
      <span class="tint" style="{{badgeStyle}}">{{ini}}</span>
      <span style="display: flex; flex-direction: column;">
        <span style="font-size: 16px; font-weight: 600;">Galicia</span>
        <span style="font-size: 12px; color: #9AA594;">{{colorName}}</span>
      </span>
    </span>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700;">1 250 000 <span style="font-size: 14px; color: #9AA594; font-weight: 500;">ARS</span></span>
  </div>

  <button type="button" class="tap" onClick="{{suggest}}" style="margin-top: 12px; width: 100%; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 14px; border-radius: 16px; border: 1px dashed #3D5A16; background: #141C0E; color: #EEF5E6; text-align: left;">
    <span style="width: 28px; height: 28px; border-radius: 9px; background: #F26E22; flex: none;"></span>
    <span style="font-size: 14px; flex-grow: 1;">Похоже на банк Galicia — взять его цвет</span>
    <span style="font-size: 13px; color: #B8FF2E; font-weight: 600;">Взять</span>
  </button>

  <div style="font-size: 13px; font-weight: 600; color: #B8FF2E; margin: 20px 0 4px;">Банки и приложения</div>
  <div style="font-size: 12px; color: #9AA594; margin-bottom: 8px;">Оттенки примерные — сверим по логотипам перед кодом</div>
  <sc-for list="{{banks}}" as="g" hint-placeholder-count="4">
    <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #9AA594; margin: 12px 0 6px;">{{g.title}}</div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;">
      <sc-for list="{{g.items}}" as="b" hint-placeholder-count="4">
        <button type="button" class="tap" onClick="{{b.pick}}" style="{{b.style}}">
          <span style="width: 36px; height: 36px; border-radius: 11px; background: {{b.color}}; color: {{b.ink}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;">{{b.ini}}</span>
          <span style="font-size: 11px; color: #C9D3C2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;">{{b.name}}</span>
        </button>
      </sc-for>
    </div>
  </sc-for>

  <div style="font-size: 13px; font-weight: 600; color: #B8FF2E; margin: 22px 0 4px;">Палитра Вольт · 36 цветов</div>
  <div style="font-size: 12px; color: #9AA594; margin-bottom: 10px;">Общая для счетов и категорий. Точкой отмечены 12 новых</div>
  <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; justify-items: center;">
    <sc-for list="{{palette}}" as="p" hint-placeholder-count="36">
      <button type="button" class="tap" onClick="{{p.pick}}" aria-label="{{p.name}}" style="{{p.ring}}">
        <span style="position: relative; width: 38px; height: 38px; border-radius: 50%; background: {{p.color}}; display: block;">
          <sc-if value="{{p.isNew}}" hint-placeholder-val="{{false}}">
            <span style="position: absolute; right: -2px; top: -2px; width: 10px; height: 10px; border-radius: 50%; background: #EEF5E6; border: 2px solid #11170E;"></span>
          </sc-if>
        </span>
      </button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { color: '#38B6FF', name: 'Синий' };
  }
  ink(hex) {
    const n = parseInt(hex.slice(1), 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
    return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#111611' : '#FFFFFF';
  }
  mix(hex, k) {
    const n = parseInt(hex.slice(1), 16), base = [17, 23, 14];
    const c = [n >> 16 & 255, n >> 8 & 255, n & 255].map((v, i) => Math.round(base[i] + (v - base[i]) * k));
    return 'rgb(' + c.join(',') + ')';
  }
  renderVals() {
    const s = this.state;
    const B = [
      ['АРГЕНТИНА', [['Galicia', 'GA', '#F26E22'], ['Santander', 'SA', '#EC0000'], ['BBVA', 'BB', '#1973B8'], ['Nación', 'BN', '#005AA7'], ['Mercado Pago', 'MP', '#00B1EA'], ['Ualá', 'UA', '#3E4FE0'], ['Naranja X', 'NX', '#FE5000'], ['Brubank', 'BR', '#6A2EE8'], ['Lemon', 'LE', '#00E36B']]],
      ['АРМЕНИЯ', [['Ameria', 'AM', '#B01E2F'], ['Inecobank', 'IN', '#0096D6'], ['Ardshinbank', 'AR', '#004B93'], ['ACBA', 'AC', '#00843D'], ['IDBank', 'ID', '#E4002B'], ['Evocabank', 'EV', '#6D2C91']]],
      ['РОССИЯ', [['Сбер', 'СБ', '#21A038'], ['Т-Банк', 'Т', '#FFDD2D'], ['Альфа', 'А', '#EF3124'], ['ВТБ', 'ВТБ', '#0A2896'], ['Ozon Банк', 'OZ', '#005BFF'], ['Райффайзен', 'Р', '#FEE600']]],
      ['КРИПТО И КОШЕЛЬКИ', [['Binance', 'BN', '#F0B90B'], ['Bybit', 'BY', '#F7A600'], ['Tether', '₮', '#26A17B'], ['Wise', 'W', '#9FE870'], ['PayPal', 'PP', '#003087'], ['Payoneer', 'PY', '#FF4800'], ['Revolut', 'R', '#0075EB']]]
    ];
    const banks = B.map(([title, items]) => ({
      title,
      items: items.map(([name, ini, color]) => {
        const on = s.color === color;
        return {
          name, ini, color, ink: this.ink(color),
          style: 'display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:14px;min-width:0;background:' + (on ? '#1F2A17' : 'transparent') + ';border:2px solid ' + (on ? color : 'transparent') + ';',
          pick: () => this.setState({ color, name: 'Цвет банка ' + name })
        };
      })
    }));
    const old = [['#FF5470', 'Красный'], ['#FF4FD8', 'Розовый'], ['#D36BFF', 'Пурпур'], ['#9D7BFF', 'Фиолет'], ['#6E8BFF', 'Индиго'], ['#38B6FF', 'Синий'], ['#2BE4FF', 'Циан'], ['#00E5C0', 'Мята'], ['#4DFF88', 'Зелёный'], ['#A8FF3E', 'Лайм'], ['#F5FF3D', 'Жёлтый'], ['#FFD43B', 'Янтарь'], ['#FFA53D', 'Оранжевый'], ['#FF7A3D', 'Пламя'], ['#FFB38A', 'Персик'], ['#8FB3CC', 'Сталь'], ['#B0B8C4', 'Серебро'], ['#7A8494', 'Графит'], ['#FF8A65', 'Коралл'], ['#E07A5F', 'Терракота'], ['#FF8FA3', 'Роза'], ['#FFC46B', 'Мёд'], ['#D9A066', 'Карамель'], ['#F2D0A4', 'Песок']];
    const fresh = [['#C9B6FF', 'Лаванда'], ['#9FD8FF', 'Небо'], ['#9BF5D6', 'Морская пена'], ['#F4F59A', 'Лимонный крем'], ['#FFB3D1', 'Румянец'], ['#E89BFF', 'Орхидея'], ['#D6F5FF', 'Лёд'], ['#DFFF00', 'Шартрез'], ['#4D4DFF', 'Ультрамарин'], ['#B5C23A', 'Олива'], ['#C9B27C', 'Хаки'], ['#3DDC97', 'Нефрит']];
    const palette = old.map((x) => [...x, false]).concat(fresh.map((x) => [...x, true])).map(([color, name, isNew]) => {
      const on = s.color === color;
      return {
        color, name, isNew,
        ring: 'padding:3px;border-radius:50%;background:none;border:2px solid ' + (on ? '#EEF5E6' : 'transparent') + ';transform:scale(' + (on ? 1.1 : 1) + ');',
        pick: () => this.setState({ color, name })
      };
    });
    return {
      banks, palette,
      colorName: s.name,
      ini: 'GA',
      cardStyle: 'display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:16px;background:' + this.mix(s.color, 0.16) + ';border:1px solid ' + this.mix(s.color, 0.45) + ';',
      badgeStyle: 'width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;background:' + s.color + ';color:' + this.ink(s.color) + ';',
      suggest: () => this.setState({ color: '#F26E22', name: 'Цвет банка Galicia' })
    };
  }
}
</script>
</body>
</html>
