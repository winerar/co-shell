name: "Автослияние PR агента в dev"

# Agent PRs (claude/*, ccr-*) into dev merge by themselves once CI is green and the PR is ready
# (not a draft) and has no `hold` label. Logic: scripts/ci/automerge.sh. main is never auto-merged.
# The merge itself is the last step of a green CI run (ci.yml, «Merge the agent PR into dev»). This workflow only
# catches the removal of `hold` from an already green PR. Private repo (2026-11-28): `workflow_run` after every CI
# run and `ready_for_review` (drafts are not built, so CI is never green yet) were billed minutes that merged nothing.
on:
  pull_request:
    types: [unlabeled]
    branches: [dev]

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write # merge, delete the branch
  pull-requests: write
  issues: write # close the issues from `Fixes #N` (a GITHUB_TOKEN merge does not)
  actions: write # dispatch CI and the board sync on dev after the merge

jobs:
  merge:
    if: github.event.label.name == 'hold'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }} # the script, not the PR code
      - name: Merge if ready
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ github.event.pull_request.number }}
        run: bash scripts/ci/automerge.sh "$TARGET"
