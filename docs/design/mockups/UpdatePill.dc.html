<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Пилюля обновления</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
:root{--bouncy:linear(0,0.009,0.035 2.1%,0.141,0.281 6.7%,0.723 12.9%,0.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,0.991,0.977 51%,0.974 53.8%,0.975 57.1%,0.997 69.8%,1.003 76.9%,1);--spatial:linear(0,0.06 2.4%,0.22 5.3%,0.5 10.5%,0.74 16%,0.89 21.5%,0.97 27%,1.01 33%,1.02 40%,1.01 50%,1)}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tap{transition:transform 520ms var(--bouncy)}
.tap:active{transform:scale(0.94);transition:transform 90ms ease-out}
.pill{animation:pillIn 700ms var(--bouncy)}
@keyframes pillIn{0%{transform:translateY(40px) scale(0.8);opacity:0}100%{transform:none;opacity:1}}
.dot{animation:dotIn 600ms var(--bouncy)}
@keyframes dotIn{0%{transform:scale(0)}100%{transform:scale(1)}}
.screen{animation:grow 520ms var(--spatial);transform-origin:50% 92%}
@keyframes grow{0%{transform:scale(0.2);opacity:0;border-radius:999px}100%{transform:none;opacity:1;border-radius:0}}
.arc{transition:stroke-dashoffset 300ms var(--spatial)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #050805; font-family: Onest, system-ui, sans-serif; color: #EEF5E6; position: relative; overflow: hidden;">
  <div style="padding: 20px 16px 0;">
    <h1 style="margin: 8px 0 14px; font-size: 30px; font-weight: 700;">Обзор</h1>
    <div style="height: 150px; border-radius: 20px; background: linear-gradient(135deg, #B8FF2E, #00F0FF); padding: 16px; box-sizing: border-box; color: #0B0F0A;">
      <div style="font-size: 13px; font-weight: 600;">Общий баланс</div>
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 32px; font-weight: 700; margin-top: 8px;">3 412,80 USD</div>
    </div>
    <div style="margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
      <div style="height: 128px; border-radius: 16px; background: #10160D; border: 1px solid #222B1E;"></div>
      <div style="height: 128px; border-radius: 16px; background: #10160D; border: 1px solid #222B1E;"></div>
      <div style="height: 128px; border-radius: 16px; background: #10160D; border: 1px solid #222B1E;"></div>
      <div style="height: 128px; border-radius: 16px; background: #10160D; border: 1px solid #222B1E;"></div>
    </div>
  </div>

  <sc-if value="{{showPill}}" hint-placeholder-val="{{true}}">
    <div class="pill" style="position: absolute; left: 0; right: 0; bottom: 98px; display: flex; justify-content: center;">
      <div style="display: flex; align-items: center; gap: 8px; height: 48px; padding-left: 4px; border-radius: 999px; background: #1B2317; border: 1px solid rgba(184,255,46,0.5); box-shadow: 0 8px 24px rgba(0,0,0,0.5);">
        <button type="button" class="tap" onClick="{{open}}" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 2px 0 4px; border: none; background: transparent; color: #EEF5E6; font-size: 15px; font-weight: 600;">
          <span style="width: 32px; height: 32px; border-radius: 50%; background: #B8FF2E; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E1F00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M6 11l6 6 6-6M5 20h14"></path></svg></span>
          Версия 43 · Обновить
        </button>
        <button type="button" class="tap" aria-label="Скрыть до следующего запуска" onClick="{{dismiss}}" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: transparent; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA594" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
    </div>
  </sc-if>

  <nav aria-label="Навигация" style="position: absolute; left: 16px; right: 16px; bottom: 18px; height: 64px; border-radius: 999px; background: #161D12; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 0 6px; box-sizing: border-box;">
    <a href="#" aria-label="Обзор" style="display: flex; justify-content: center; align-items: center; height: 44px; margin: 0 2px; border-radius: 999px; background: #B8FF2E;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0E1F00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"></path></svg></a>
    <a href="#" aria-label="Операции" style="display: flex; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9AA594" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9"></path></svg></a>
    <a href="#" aria-label="Новая операция" style="display: flex; justify-content: center;"><span style="width: 52px; height: 52px; border-radius: 50%; background: #B8FF2E; display: flex; align-items: center; justify-content: center;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0E1F00" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span></a>
    <a href="#" aria-label="Счета" style="display: flex; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9AA594" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"></rect><path d="M3 10h18"></path></svg></a>
    <a href="#" aria-label="Ещё, есть обновление" style="display: flex; justify-content: center;"><span style="position: relative; display: inline-flex;"><svg width="24" height="24" viewBox="0 0 24 24" fill="#9AA594" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg><span class="dot" style="position: absolute; top: 0; right: -4px; width: 8px; height: 8px; border-radius: 50%; background: #B266FF;"></span></span></a>
  </nav>

  <sc-if value="{{showScreen}}" hint-placeholder-val="{{false}}">
    <div class="screen" style="position: absolute; inset: 0; background: #050805; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column;">
      <div style="display: flex; align-items: center; gap: 4px; margin: 4px -8px 0;">
        <button type="button" class="tap" aria-label="Назад" onClick="{{back}}" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: transparent; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#EEF5E6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
        <h1 style="margin: 0; font-size: 22px; font-weight: 700;">Обновление</h1>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; padding-top: 28px;">
        <div style="position: relative; width: 210px; height: 210px;">
          <svg width="210" height="210" viewBox="0 0 210 210" aria-hidden="true" style="position: absolute; inset: 0; transform: rotate(-90deg);">
            <circle cx="105" cy="105" r="92" fill="none" stroke="#1A2117" stroke-width="12"></circle>
            <circle class="arc" cx="105" cy="105" r="92" fill="none" stroke="#B8FF2E" stroke-width="12" stroke-linecap="round" stroke-dasharray="578" stroke-dashoffset="{{offset}}"></circle>
          </svg>
          <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 44px; font-weight: 700;">{{pct}}<span style="font-size: 20px; color: #9AA594;">%</span></span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9AA594;">{{mb}} из 8,1 МБ</span>
          </div>
        </div>
        <div style="font-size: 22px; font-weight: 700; margin-top: 14px;">{{title}}</div>
        <div style="font-size: 14px; color: #9AA594; margin-top: 4px;">Можно выйти — загрузка продолжится</div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { st: 'pill', p: 0 }; }
  componentWillUnmount() { clearInterval(this.t); }
  start() {
    this.setState({ st: 'screen', p: 0 });
    clearInterval(this.t);
    this.t = setInterval(() => {
      const p = Math.min(100, this.state.p + 3 + Math.random() * 5);
      this.setState({ p });
      if (p >= 100) clearInterval(this.t);
    }, 160);
  }
  renderVals() {
    const s = this.state;
    return {
      showPill: s.st === 'pill',
      showScreen: s.st === 'screen',
      open: () => this.start(),
      dismiss: () => this.setState({ st: 'hidden' }),
      back: () => { clearInterval(this.t); this.setState({ st: 'pill', p: 0 }); },
      offset: String(578 * (1 - s.p / 100)),
      pct: String(Math.round(s.p)),
      mb: (8.1 * s.p / 100).toFixed(1).replace('.', ','),
      title: s.p >= 100 ? 'Готово к установке' : 'Скачиваем…'
    };
  }
}
</script>
</body>
</html>
