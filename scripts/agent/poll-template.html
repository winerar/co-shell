<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Poll page for the owner's choice of mockup variants (format approved 2026-11-13). Filled by poll-page.py. */
:root {
  --bg: #F6FAEF; --card: #FFFFFF; --line: #DCE5D2; --fg: #10160D; --muted: #5B6656;
  --accent: #3F6B00; --accent-bg: #E6F5CF; --on-accent: #FFFFFF;
  --display: "Onest", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #050805; --card: #10160D; --line: #222B1E; --fg: #EEF5E6; --muted: #9AA594;
  --accent: #B8FF2E; --accent-bg: #1D2A0B; --on-accent: #0E1F00; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #050805; --card: #10160D; --line: #222B1E; --fg: #EEF5E6; --muted: #9AA594;
  --accent: #B8FF2E; --accent-bg: #1D2A0B; --on-accent: #0E1F00; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--display); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 28px; }
header h1 { margin: 0; font-size: 30px; text-wrap: balance; }
header p { margin: 6px 0 0; color: var(--muted); max-width: 68ch; }
header a { color: var(--accent); }
.progress { margin-top: 12px; font-family: var(--mono); font-size: 13px; color: var(--muted); }
#qs { display: flex; flex-direction: column; gap: 20px; }
section { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.qhead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.qhead h2 { margin: 0; font-size: 20px; text-wrap: balance; }
.num { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.saved { margin-left: auto; font-size: 13px; color: var(--accent); }
.lead { margin: 0; color: var(--muted); max-width: 75ch; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.opt { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 16px; border: 2px solid var(--line); cursor: pointer; min-width: 0; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-bg); }
.opt input { position: absolute; opacity: 0; }
.opt:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
.opt .t { display: flex; gap: 8px; align-items: center; font-weight: 600; }
.radio { width: 20px; height: 20px; flex: none; border-radius: 50%; border: 2px solid var(--muted); box-sizing: border-box; }
.opt:has(input:checked) .radio { border: 6px solid var(--accent); }
.rec { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--accent); color: var(--on-accent); }
.opt p { margin: 0; font-size: 13px; color: var(--muted); }
.shots { display: flex; gap: 8px; overflow-x: auto; }
.shots button { padding: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: none; cursor: zoom-in; flex: none; }
.shots img { display: block; width: 150px; height: auto; }
.common { display: flex; flex-direction: column; gap: 8px; }
.common h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); }
label.note { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 44px; resize: vertical; }
.status { font-size: 13px; color: var(--muted); }
dialog { border: none; padding: 0; background: transparent; max-width: 100vw; }
dialog::backdrop { background: rgba(0,0,0,0.75); }
dialog img { display: block; max-height: 92vh; max-width: 92vw; border-radius: 16px; }
dialog button { position: absolute; top: 8px; right: 8px; width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--card); color: var(--fg); font-size: 20px; cursor: pointer; }
</style>

<div class="wrap">
  <header>
    <h1>__H1__</h1>
    <p>__INTRO__ Отметьте вариант и при желании допишите правку: ответ сохраняется сразу. Тап по картинке открывает её крупно. Живые доски — на <a href="https://claude.ai/artifact/Kfegn8qM8QEnPKr7HRYpw5" target="_blank" rel="noopener">холсте дизайна</a>, вкладка «Предложения», верхние ряды.</p>
    <div class="progress" id="progress"></div>
  </header>
  <div id="qs"></div>
  <p class="status" id="status">Подключаем сохранение ответов…</p>
</div>

<dialog id="zoom"><button type="button" aria-label="Закрыть" id="zoomClose">✕</button><img id="zoomImg" alt=""></dialog>

<script>
const Q = __QUESTIONS__;
const answers = {};
let db = null;
const el = (tag, props = {}, kids = []) => { const n = Object.assign(document.createElement(tag), props); kids.forEach(k => n.append(k)); return n; };
const src = name => 'img/' + name + '.png';

function shot(name) {
  const b = el('button', { type: 'button', ariaLabel: 'Открыть крупно' });
  b.append(el('img', { src: src(name), alt: 'Макет ' + name, loading: 'lazy', width: 150, height: 325 }));
  b.addEventListener('click', () => { document.getElementById('zoomImg').src = src(name); document.getElementById('zoom').showModal(); });
  return b;
}

function render() {
  const root = document.getElementById('qs');
  for (const q of Q) {
    const sec = el('section', { id: q.id });
    sec.append(el('div', { className: 'qhead' }, [el('span', { className: 'num', textContent: q.num }), el('h2', { textContent: q.title }), el('span', { className: 'saved', id: q.id + '-saved' })]));
    sec.append(el('p', { className: 'lead', textContent: q.lead }));
    const opts = el('div', { className: 'opts', role: 'radiogroup', ariaLabel: q.title });
    for (const o of q.opts) {
      const input = el('input', { type: 'radio', name: q.id, value: o.v, id: q.id + '-' + o.v });
      input.addEventListener('change', () => save(q.id, { choice: o.v }));
      const t = el('span', { className: 't' }, [el('span', { className: 'radio' }), o.t]);
      if (o.rec) t.append(el('span', { className: 'rec', textContent: 'рекомендую' }));
      opts.append(el('label', { className: 'opt' }, [input, t, el('p', { textContent: o.d }), el('div', { className: 'shots' }, (o.img || []).map(shot))]));
    }
    sec.append(opts);
    if (q.common && q.common.length) sec.append(el('div', { className: 'common' }, [el('h3', { textContent: 'Общее для всех вариантов' }), el('div', { className: 'shots' }, q.common.map(shot))]));
    const ta = el('textarea', { id: q.id + '-note', rows: 2, placeholder: 'Например: «А, но без счётчика»' });
    let timer;
    ta.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => save(q.id, { note: ta.value }), 700); });
    sec.append(el('label', { className: 'note' }, ['Правки и пожелания (необязательно)', ta]));
    root.append(sec);
  }
  document.getElementById('zoomClose').addEventListener('click', () => document.getElementById('zoom').close());
  document.getElementById('zoom').addEventListener('click', e => { if (e.target.id === 'zoom') e.target.close(); });
  progress();
}

function progress() {
  document.getElementById('progress').textContent = 'Ответов: ' + Q.filter(x => answers[x.id] && answers[x.id].choice).length + ' из ' + Q.length;
}

function show(id) {
  const a = answers[id] || {};
  if (a.choice) { const r = document.getElementById(id + '-' + a.choice); if (r) r.checked = true; }
  const ta = document.getElementById(id + '-note');
  if (a.note != null && document.activeElement !== ta) ta.value = a.note;
  const q = Q.find(x => x.id === id), o = q && q.opts.find(x => x.v === a.choice);
  if (q) document.getElementById(id + '-saved').textContent = o ? 'Выбрано: ' + o.t.split(':')[0] : '';
  progress();
}

async function save(id, patch) {
  answers[id] = Object.assign({}, answers[id], patch, { at: new Date().toISOString() });
  show(id);
  const st = document.getElementById('status');
  if (!db) { st.textContent = 'Сохранение недоступно в этом окне: ответ виден только здесь. Напишите выбор в чат.'; return; }
  try { await db.collection('answers').doc(id).set(answers[id]); st.textContent = 'Сохранено. Агент прочитает ответы из этой страницы.'; }
  catch (e) { st.textContent = 'Не сохранилось (' + (e && e.code || 'ошибка') + '). Выберите ещё раз или напишите выбор в чат.'; }
}

render();
(async () => {
  const st = document.getElementById('status');
  try { db = window.claude ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (!db) { st.textContent = 'Сохранение недоступно в этом окне: отметьте варианты и напишите выбор в чат.'; return; }
  st.textContent = 'Ответы сохраняются автоматически.';
  db.collection('answers').onSnapshot(snap => {
    snap.docs.forEach(d => { answers[d.id] = d.data(); show(d.id); });
  }, () => { st.textContent = 'Связь с хранилищем прервалась — обновите страницу.'; });
})();
</script>
