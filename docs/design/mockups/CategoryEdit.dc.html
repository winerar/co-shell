<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Категория</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
:root{--bouncy:linear(0,0.009,0.035 2.1%,0.141,0.281 6.7%,0.723 12.9%,0.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,0.991,0.977 51%,0.974 53.8%,0.975 57.1%,0.997 69.8%,1.003 76.9%,1)}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tap{transition:transform 520ms var(--bouncy),background-color 300ms ease-out,box-shadow 300ms ease-out}
.tap:active{transform:scale(0.92);transition:transform 90ms ease-out}
.hero{transition:background-color 300ms ease-out}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #050805; font-family: Onest, system-ui, sans-serif; color: #EEF5E6; position: relative; overflow: hidden; padding: 16px 16px 0;">
  <div style="display: flex; align-items: center; gap: 4px; margin: 4px -8px 0;">
    <button type="button" class="tap" aria-label="Закрыть" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: transparent; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#EEF5E6" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    <h1 style="margin: 0; font-size: 22px; font-weight: 700; flex-grow: 1;">{{title}}</h1>
    <button type="button" class="tap" aria-label="В архив" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: transparent; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9AA594" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16v3H4zM5 10v9h14v-9M10 14h4"></path></svg></button>
  </div>

  <div role="tablist" style="margin-top: 8px; display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 999px; background: #10160D; border: 1px solid #222B1E;">
    <button type="button" role="tab" class="tap" onClick="{{toCategory}}" style="{{catTab}}">Категория</button>
    <button type="button" role="tab" class="tap" onClick="{{toFolder}}" style="{{folderTab}}">Папка</button>
  </div>

  <div style="display: flex; align-items: center; gap: 14px; margin-top: 14px;">
    <span class="hero" style="width: 64px; height: 64px; flex-shrink: 0; border-radius: 50%; background: {{color}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 28px {{glow}};">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0B0F0A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{iconPath}}"></path></svg>
    </span>
    <label style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px; padding: 8px 14px; border-radius: 14px; background: #10160D; border: 1px solid #B8FF2E;">
      <span style="font-size: 12px; color: #B8FF2E;">Название</span>
      <input value="{{name}}" style="border: none; outline: none; background: transparent; color: #EEF5E6; font-family: inherit; font-size: 18px; padding: 0;">
    </label>
  </div>

  <div style="margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
    <div style="padding: 10px 14px; border-radius: 14px; background: #10160D; border: 1px solid #222B1E;">
      <div style="font-size: 12px; color: #9AA594;">Тип</div>
      <div style="font-size: 15px; margin-top: 2px;">Расходы</div>
    </div>
    <div style="padding: 10px 14px; border-radius: 14px; background: #10160D; border: 1px solid #222B1E; display: flex; align-items: center; justify-content: space-between;">
      <span><span style="display: block; font-size: 12px; color: #9AA594;">{{secondLabel}}</span><span style="font-size: 15px;">{{secondValue}}</span></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA594" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </div>
  </div>

  <sc-if value="{{isFolder}}" hint-placeholder-val="{{false}}">
    <div style="margin: 16px 4px 8px; font-size: 13px; font-weight: 600; color: #9AA594;">Категории в папке</div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px;">
      <sc-for list="{{kids}}" as="k" hint-placeholder-count="6">
        <button type="button" class="tap" onClick="{{k.pick}}" style="{{k.style}}">{{k.mark}} {{k.label}}</button>
      </sc-for>
    </div>
  </sc-if>

  <div style="margin: 16px 4px 8px; font-size: 13px; font-weight: 600; color: #9AA594;">Иконка</div>
  <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px;">
    <sc-for list="{{icons}}" as="i" hint-placeholder-count="18">
      <button type="button" class="tap" aria-label="{{i.label}}" onClick="{{i.pick}}" style="aspect-ratio: 1; border-radius: 14px; border: {{i.border}}; background: {{i.bg}}; display: flex; align-items: center; justify-content: center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{i.ink}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.d}}"></path></svg>
      </button>
    </sc-for>
  </div>

  <div style="margin: 18px 4px 8px; font-size: 13px; font-weight: 600; color: #9AA594;">Цвет</div>
  <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px;">
    <sc-for list="{{colors}}" as="c" hint-placeholder-count="16">
      <button type="button" class="tap" aria-label="{{c.label}}" onClick="{{c.pick}}" style="aspect-ratio: 1; border-radius: 50%; border: none; background: {{c.hex}}; box-shadow: {{c.ring}};"></button>
    </sc-for>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 20px;">
    <button type="button" class="tap" style="width: 100%; height: 56px; border-radius: 999px; border: none; background: #B8FF2E; color: #0E1F00; font-size: 17px; font-weight: 600;">Сохранить</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { icon: 1, color: 9, folder: false, kids: { 'Продукты': true, 'Кафе': true } }; }
  renderVals() {
    const s = this.state;
    const icons = [
      ['Корзина', 'M3 4h2l2 11h11l2-8H7'], ['Пекарня', 'M5 14c0-5 3-8 7-8s7 3 7 8v3H5zM9 10v7M15 10v7'], ['Кафе', 'M5 8h11v6a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4zM16 10h2a2 2 0 0 1 0 4h-2'],
      ['Бар', 'M6 4h12l-6 8zM12 12v7M8 20h8'], ['Дом', 'M4 11l8-7 8 7v9H4z'], ['Такси', 'M5 16h14M6 16l1.5-5h9L18 16'],
      ['Поезд', 'M7 4h10v11H7zM7 10h10M9 19l-2 2M15 19l2 2'], ['Велосипед', 'M6 17a3 3 0 1 0 0-.1M18 17a3 3 0 1 0 0-.1M6 17l4-7h5l3 7M10 10l-1-3h-2'], ['Отель', 'M3 18V8M21 18v-5H3M7 12a2 2 0 1 0 0-.1'],
      ['Отпуск', 'M3 13l18-7-7 18-2-8z'], ['Здоровье', 'M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z'], ['Игры', 'M6 9h12a3 3 0 0 1 3 3v2a3 3 0 0 1-5 2l-1-1H9l-1 1a3 3 0 0 1-5-2v-2a3 3 0 0 1 3-3z'],
      ['Музыка', 'M9 18V6l10-2v12M9 18a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM19 16a2 2 0 1 1-4 0 2 2 0 0 1 4 0z'], ['Подарок', 'M4 10h16v10H4zM12 10v10M3 7h18v3H3z'], ['Сад', 'M12 20v-8M12 12c-4 0-6-3-6-7 4 0 6 3 6 7zM12 12c4 0 6-3 6-7-4 0-6 3-6 7z'],
      ['Стройка', 'M3 20h18M6 20V10l6-5 6 5v10M10 20v-5h4v5'], ['Счета', 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6'], ['Банк', 'M3 9l9-5 9 5M5 9v9M10 9v9M14 9v9M19 9v9M3 20h18']
    ];
    const colors = [
      ['Лайм', '#B8FF2E'], ['Циан', '#00F0FF'], ['Фиолет', '#B266FF'], ['Маджента', '#FF3DD6'], ['Жёлтый', '#FFE600'], ['Оранжевый', '#FF8A5C'], ['Малина', '#FF5C7F'], ['Мята', '#5CFFB0'],
      ['Коралл', '#FF7A6B'], ['Терракота', '#E07A4F'], ['Роза', '#FF8FA3'], ['Мёд', '#FFC46B'], ['Карамель', '#D99A5B'], ['Песок', '#E8D3A2'], ['Небо', '#6BB8FF'], ['Графит', '#7A8494']
    ];
    const col = colors[s.color][1];
    const on = 'height:38px;border-radius:999px;border:none;background:#B8FF2E;color:#0E1F00;font-size:15px;font-weight:600;';
    const off = 'height:38px;border-radius:999px;border:none;background:transparent;color:#9AA594;font-size:15px;';
    const kidNames = ['Продукты', 'Кафе', 'Пекарня', 'Доставка', 'Бар', 'Рынок'];
    const n = Object.values(s.kids).filter(Boolean).length;
    const shown = s.folder ? icons.slice(0, 12) : icons;
    return {
      isFolder: s.folder,
      title: s.folder ? 'Новая папка' : 'Категория',
      name: s.folder ? 'Еда' : 'Пекарня',
      secondLabel: s.folder ? 'Внутри' : 'Папка',
      secondValue: s.folder ? n + ' категории' : 'Еда',
      catTab: s.folder ? off : on,
      folderTab: s.folder ? on : off,
      toCategory: () => this.setState({ folder: false }),
      toFolder: () => this.setState({ folder: true }),
      kids: kidNames.map(label => ({
        label, mark: s.kids[label] ? '✓' : '+',
        style: 'height:34px;padding:0 12px;border-radius:999px;font-size:13px;' + (s.kids[label] ? 'border:none;background:' + col + ';color:#0B0F0A;font-weight:600;' : 'border:1px solid #2E382A;background:transparent;color:#C9D3C2;'),
        pick: () => this.setState({ kids: { ...s.kids, [label]: !s.kids[label] } })
      })),
      color: col, glow: col + '55', iconPath: icons[s.icon][1],
      icons: shown.map(([label, d], n) => ({
        label, d,
        bg: n === s.icon ? col : '#10160D',
        ink: n === s.icon ? '#0B0F0A' : '#C9D3C2',
        border: n === s.icon ? 'none' : '1px solid #222B1E',
        pick: () => this.setState({ icon: n })
      })),
      colors: colors.map(([label, hex], n) => ({
        label, hex,
        ring: n === s.color ? '0 0 0 2px #050805, 0 0 0 4px ' + hex : 'none',
        pick: () => this.setState({ color: n })
      }))
    };
  }
}
</script>
</body>
</html>
