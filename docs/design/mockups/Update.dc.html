<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Обновление приложения</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
:root{
--spatial:linear(0,0.06 2.4%,0.22 5.3%,0.5 10.5%,0.74 16%,0.89 21.5%,0.97 27%,1.01 33%,1.02 40%,1.01 50%,1);
--bouncy:linear(0,0.009,0.035 2.1%,0.141,0.281 6.7%,0.723 12.9%,0.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,0.991,0.977 51%,0.974 53.8%,0.975 57.1%,0.997 69.8%,1.003 76.9%,1);
}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tap{transition:transform 520ms var(--bouncy),background-color 300ms ease-out,color 300ms ease-out}
.tap:active{transform:scale(0.95);transition:transform 90ms ease-out}
.arc{transition:stroke-dashoffset 420ms var(--spatial),stroke 300ms ease-out}
.pop{animation:pop 600ms var(--bouncy)}
@keyframes pop{0%{transform:scale(0.4);opacity:0}100%{transform:scale(1);opacity:1}}
.spin{animation:spin 1600ms linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.breath{animation:breath 2200ms ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.rise{animation:rise 520ms var(--spatial)}
@keyframes rise{0%{transform:translateY(14px);opacity:0}100%{transform:none;opacity:1}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #050805; font-family: Onest, system-ui, sans-serif; color: #EEF5E6; position: relative; overflow: hidden; padding: 16px 16px 0;">
  <div style="display: flex; align-items: center; gap: 4px; margin: 4px -8px 0;">
    <button type="button" class="tap" aria-label="Назад" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: transparent; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#EEF5E6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <h1 style="margin: 0; font-size: 22px; font-weight: 700;">Обновление</h1>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 0 8px;">
    <div class="{{ringClass}}" style="position: relative; width: 210px; height: 210px;">
      <svg width="210" height="210" viewBox="0 0 210 210" aria-hidden="true" style="position: absolute; inset: 0; transform: rotate(-90deg);">
        <circle cx="105" cy="105" r="92" fill="none" stroke="#1A2117" stroke-width="12"></circle>
        <circle class="arc" cx="105" cy="105" r="92" fill="none" stroke="{{arcColor}}" stroke-width="12" stroke-linecap="round" stroke-dasharray="578" stroke-dashoffset="{{offset}}"></circle>
      </svg>
      <sc-if value="{{isChecking}}" hint-placeholder-val="{{false}}">
        <svg class="spin" width="210" height="210" viewBox="0 0 210 210" aria-hidden="true" style="position: absolute; inset: 0;">
          <circle cx="105" cy="105" r="92" fill="none" stroke="#B8FF2E" stroke-width="12" stroke-linecap="round" stroke-dasharray="120 458"></circle>
        </svg>
      </sc-if>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
        <sc-if value="{{showPct}}" hint-placeholder-val="{{false}}">
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 44px; font-weight: 700;">{{pct}}<span style="font-size: 20px; color: #9AA594;">%</span></span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9AA594;">{{mb}} из 8,1 МБ</span>
        </sc-if>
        <sc-if value="{{showIcon}}" hint-placeholder-val="{{true}}">
          <span class="pop" style="width: 84px; height: 84px; border-radius: 50%; background: {{iconBg}}; display: flex; align-items: center; justify-content: center;">
            <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="{{iconInk}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{iconPath}}"></path></svg>
          </span>
        </sc-if>
      </div>
    </div>
    <div class="rise" style="font-size: 22px; font-weight: 700; margin-top: 10px;">{{title}}</div>
    <div style="font-size: 14px; color: #9AA594;">{{subtitle}}</div>
  </div>

  <div style="margin-top: 14px; padding: 14px 16px; border-radius: 16px; background: #10160D; border: 1px solid #222B1E;">
    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px;">
      <span style="font-size: 13px; font-weight: 600; color: #B8FF2E;">Что нового в версии 42</span>
      <span style="font-size: 12px; color: #9AA594;">10 ноября</span>
    </div>
    <ul style="margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: #DDE5D6; line-height: 1.35;">
      <li>Новая шторка ввода: сначала счёт, своя клавиатура</li>
      <li>Счета группами, поиск по счетам</li>
      <li>Цвета банков и приложений для счетов</li>
    </ul>
  </div>

  <div style="display: flex; justify-content: space-between; padding: 12px 4px 0; font-size: 12px; color: #9AA594;">
    <span>Установлена: 41 · 9 ноября</span>
    <span>Проверка: {{checked}}</span>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 20px; display: flex; flex-direction: column; gap: 8px;">
    <button type="button" class="tap" onClick="{{act}}" style="{{btnStyle}}">{{btn}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { st: 'avail', p: 0 };
  }
  componentWillUnmount() { clearInterval(this.t); clearTimeout(this.c); }
  download() {
    this.setState({ st: 'down', p: 0 });
    clearInterval(this.t);
    this.t = setInterval(() => {
      const p = Math.min(100, this.state.p + 4 + Math.random() * 6);
      if (p >= 100) { clearInterval(this.t); this.setState({ st: 'ready', p: 100 }); } else this.setState({ p });
    }, 160);
  }
  renderVals() {
    const s = this.state;
    const C = 578;
    const check = 'M5 12l5 5 9-10', arrow = 'M12 4v12M6 11l6 6 6-6M5 20h14', box = 'M4 8l8-4 8 4v8l-8 4-8-4zM4 8l8 4 8-4M12 12v8';
    const V = {
      avail: { title: 'Доступна версия 42', sub: '8,1 МБ · вышла сегодня', btn: 'Скачать и установить', off: 0, color: '#B8FF2E', icon: arrow, bg: '#B8FF2E', ink: '#0E1F00', ring: 'breath', act: () => this.download() },
      down: { title: 'Скачиваем…', sub: 'Можно выйти — продолжится в фоне', btn: 'Отменить', off: C * (1 - s.p / 100), color: '#B8FF2E', act: () => { clearInterval(this.t); this.setState({ st: 'avail', p: 0 }); } },
      ready: { title: 'Готово к установке', sub: 'Android попросит подтвердить', btn: 'Установить', off: 0, color: '#00F0FF', icon: box, bg: '#00F0FF', ink: '#002A2E', ring: '', act: () => { this.setState({ st: 'checking' }); this.c = setTimeout(() => this.setState({ st: 'latest' }), 1400); } },
      checking: { title: 'Проверяем…', sub: 'Ищем новую версию', btn: 'Проверяем…', off: C, color: '#1A2117', ring: '', act: () => {} },
      latest: { title: 'У вас последняя версия', sub: 'Версия 42 установлена', btn: 'Проверить ещё раз', off: 0, color: '#2E382A', icon: check, bg: '#1D2A0B', ink: '#B8FF2E', ring: '', act: () => { this.setState({ st: 'checking' }); this.c = setTimeout(() => this.setState({ st: 'avail', p: 0 }), 1400); } }
    }[s.st];
    const primary = s.st === 'avail' || s.st === 'ready';
    return {
      title: V.title, subtitle: V.sub, btn: V.btn, act: V.act,
      offset: String(V.off), arcColor: V.color,
      ringClass: V.ring || '',
      isChecking: s.st === 'checking',
      showPct: s.st === 'down',
      showIcon: !!V.icon,
      iconPath: V.icon || '', iconBg: V.bg || 'transparent', iconInk: V.ink || '#000',
      pct: String(Math.round(s.p)),
      mb: (8.1 * s.p / 100).toFixed(1).replace('.', ','),
      checked: s.st === 'latest' ? 'только что' : '2 мин назад',
      btnStyle: 'width:100%;height:56px;border-radius:999px;font-size:17px;font-weight:600;' + (primary ? 'border:none;background:#B8FF2E;color:#0E1F00;' : 'border:1px solid #2E382A;background:transparent;color:#B8FF2E;')
    };
  }
}
</script>
</body>
</html>
