name = "co-shell-ai"
main = "worker.js"
compatibility_date = "2026-11-01"

[vars]
FIREBASE_PROJECT_ID = "REPLACE_WITH_FIREBASE_PROJECT_ID"
DAILY_LIMIT = "100"

# wrangler kv namespace create USAGE  → paste the id here
[[kv_namespaces]]
binding = "USAGE"
id = "REPLACE_WITH_KV_ID"

# Secret (never in this file): wrangler secret put ANTHROPIC_API_KEY
