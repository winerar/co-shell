name: Tasks

# Keeps the task board true without manual work (docs/agents/tasks.md).
# Labels:
# - a PR merged into dev → issues it names as `Fixes #N` get `status:in-dev`
#   (they close when the release PR dev → main is merged);
# - a closed issue loses its `status:*` label.
# Issues created with GITHUB_TOKEN (feedback.yml) do not trigger workflows, so the feedback script
# labels them `status:triage` itself.
# Board (GitHub Projects, owner's view): scripts/ci/project_board.py — open issues on the board, column
# follows the `status:*` label, a card the owner moved changes the label. Needs the PROJECT_TOKEN secret.
on:
  pull_request:
    types: [closed]
    branches: [dev]
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  schedule:
    - cron: "41 */3 * * *" # picks up cards the owner moved (board moves send no events to the repo)
  workflow_dispatch:

concurrency:
  group: tasks
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read

env:
  PROJECT_OWNER: winerar
  PROJECT_NUMBER: 4

jobs:
  merged-into-dev:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Mark fixed issues as in dev
        run: |
          nums=$(grep -oiE '\b(fix(es|ed)?|close[sd]?|resolve[sd]?)[[:space:]]+#[0-9]+' <<<"$BODY" \
            | grep -oE '[0-9]+$' | sort -un || true)
          for n in $nums; do
            [ "$(gh issue view "$n" --json state -q .state 2>/dev/null)" = OPEN ] || continue
            old=$(gh issue view "$n" --json labels -q '[.labels[].name | select(startswith("status:"))] | join(",")')
            gh issue edit "$n" --add-label status:in-dev ${old:+--remove-label "$old"}
            echo "#$n → status:in-dev"
          done

  closed:
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      N: ${{ github.event.issue.number }}
    steps:
      - name: Drop status labels
        run: |
          old=$(gh issue view "$N" --json labels -q '[.labels[].name | select(startswith("status:"))] | join(",")')
          [ -z "$old" ] || gh issue edit "$N" --remove-label "$old"

  board:
    needs: [merged-into-dev, closed]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check setup
        if: env.PROJECT_TOKEN == ''
        run: echo "::warning::PROJECT_TOKEN secret is not set — board not synced (docs/agents/tasks.md)"
      - uses: actions/checkout@v7
        if: env.PROJECT_TOKEN != ''
      - name: Sync the board with labels
        if: env.PROJECT_TOKEN != ''
        run: python3 scripts/ci/project_board.py
