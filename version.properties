# Version name of release builds: <major>.<minor>, minor = merges into main (= releases) minus minorOffset.
# Computed by scripts/ci/version_name.py on main (CI → VERSION_NAME). 1.0 is the owner's call: set major=1
# and minorOffset to the current number of merges (`git rev-list --count --first-parent --merges origin/main`).
major=0
minorOffset=0
