name: Labels

# Keeps repository labels in sync with .github/labels.json: create or update; `from` renames an old
# label (issues keep it under the new name); `delete: true` removes a retired label.
# Task workflow and label meanings: docs/agents/tasks.md.
on:
  push:
    paths: [".github/labels.json", ".github/workflows/labels.yml"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: Create, rename, update or delete labels
        run: |
          have=$(gh label list --limit 200 --json name -q '.[].name')
          jq -c '.[]' .github/labels.json | while read -r l; do
            name=$(jq -r .name <<<"$l"); from=$(jq -r '.from // empty' <<<"$l")
            if [ "$(jq -r '.delete // false' <<<"$l")" = true ]; then
              ! grep -qxF "$name" <<<"$have" || gh label delete "$name" --yes
              continue
            fi
            if [ -n "$from" ] && grep -qxF "$from" <<<"$have" && ! grep -qxF "$name" <<<"$have"; then
              gh label edit "$from" --name "$name"
            fi
            gh label create "$name" --force \
              --color "$(jq -r .color <<<"$l")" --description "$(jq -r .description <<<"$l")"
          done
