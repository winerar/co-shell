<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Настройки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
:root{--bouncy:linear(0,0.009,0.035 2.1%,0.141,0.281 6.7%,0.723 12.9%,0.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,0.991,0.977 51%,0.974 53.8%,0.975 57.1%,0.997 69.8%,1.003 76.9%,1)}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tap{transition:transform 520ms var(--bouncy),background-color 300ms ease-out,border-color 300ms ease-out,color 300ms ease-out}
.tap:active{transform:scale(0.95);transition:transform 90ms ease-out}
.paint{transition:background-color 400ms ease-out,color 400ms ease-out,border-color 400ms ease-out}
</style>
</helmet>
<div class="paint" style="width: 390px; height: 844px; box-sizing: border-box; background: {{bg}}; font-family: Onest, system-ui, sans-serif; color: {{ink}}; position: relative; overflow: hidden; padding: 16px 16px 0;">
  <div style="display: flex; align-items: center; gap: 4px; margin: 4px -8px 0;">
    <button type="button" class="tap" aria-label="Назад" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: transparent; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{ink}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <h1 style="margin: 0; font-size: 22px; font-weight: 700;">Настройки</h1>
  </div>

  <div style="margin: 12px 4px 8px; font-size: 13px; font-weight: 600; color: {{muted}};">Тема</div>
  <div class="paint" style="display: grid; grid-template-columns: repeat(3, 1fr); padding: 4px; border-radius: 999px; background: {{card}}; border: 1px solid {{line}};">
    <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
      <button type="button" class="tap" onClick="{{m.pick}}" style="{{m.style}}">{{m.label}}</button>
    </sc-for>
  </div>

  <div style="margin: 16px 4px 8px; font-size: 13px; font-weight: 600; color: {{muted}};">Палитра</div>
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
    <sc-for list="{{palettes}}" as="p" hint-placeholder-count="6">
      <button type="button" class="tap paint" onClick="{{p.pick}}" style="padding: 12px; border-radius: 16px; background: {{card}}; border: {{p.border}}; color: {{ink}}; text-align: left; display: flex; flex-direction: column; gap: 10px;">
        <span style="display: flex; gap: 4px;">
          <span style="width: 28px; height: 28px; border-radius: 50%; background: {{p.a}};"></span>
          <span style="width: 28px; height: 28px; border-radius: 50%; background: {{p.b}}; margin-left: -10px;"></span>
          <span style="width: 28px; height: 28px; border-radius: 50%; background: {{p.c}}; margin-left: -10px;"></span>
        </span>
        <span><span style="display: block; font-size: 15px; font-weight: 600;">{{p.name}}</span><span style="font-size: 11px; color: {{muted}};">{{p.hint}}</span></span>
      </button>
    </sc-for>
  </div>

  <div class="paint" style="margin-top: 16px; border-radius: 16px; background: {{card}}; border: 1px solid {{line}}; overflow: hidden;">
    <div style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 14px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{muted}}" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M6 7h12M6 12h12M6 17h12"></path></svg>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px;">Валюты отчётов</span><span style="font-size: 12px; color: {{muted}};">Основная: USD</span></span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 14px; border-top: 1px solid {{line}};">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{muted}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8v18H8zM4 8v8M20 8v8"></path></svg>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px;">Встряхнуть — новая операция</span><span style="font-size: 12px; color: {{muted}};">На вкладках, не в формах</span></span>
      <span style="width: 52px; height: 32px; border-radius: 999px; background: {{accent}}; position: relative;"><span style="position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; background: {{onAccent}};"></span></span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 14px; border-top: 1px solid {{line}};">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{accent2}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px;">Обновление приложения</span><span style="font-size: 12px; color: {{accent2}}; font-weight: 600;">Доступна версия 43</span></span>
      <span style="width: 8px; height: 8px; border-radius: 50%; background: {{accent2}};"></span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 2, pal: 0 }; }
  renderVals() {
    const s = this.state;
    const P = [
      { name: 'Вольт', hint: 'кислотный лайм и циан', a: '#B8FF2E', b: '#00F0FF', c: '#B266FF', on: '#0E1F00', deep: '#3B7A1C' },
      { name: 'Мохито', hint: 'мягкий лайм и фиолет', a: '#91E668', b: '#A77BFF', c: '#38D9FF', on: '#122A06', deep: '#3B7A1C' },
      { name: 'Манго', hint: 'тёплый закат', a: '#FF8A3D', b: '#FF3D7F', c: '#FFC93C', on: '#2A1100', deep: '#B4501A' },
      { name: 'Ультра', hint: 'электрик и маджента', a: '#3D7BFF', b: '#FF2BD6', c: '#91E668', on: '#FFFFFF', deep: '#2A5BD6' },
      { name: 'Лагуна', hint: 'бирюза и коралл', a: '#2EE6C5', b: '#FF6B5C', c: '#FFD27A', on: '#00261F', deep: '#0F7F6C' },
      { name: 'Сакура', hint: 'розовый и мята', a: '#FF7AB8', b: '#7CF2C4', c: '#B9A4FF', on: '#33001A', deep: '#B8306F' }
    ];
    const p = P[s.pal];
    const light = s.mode === 1;
    const T = light
      ? { bg: '#F7FBF2', ink: '#14200F', muted: '#5C6757', card: '#FFFFFF', line: '#DCE5D3' }
      : { bg: '#050805', ink: '#EEF5E6', muted: '#9AA594', card: '#10160D', line: '#222B1E' };
    const modes = ['Системная', 'Светлая', 'Тёмная'];
    return {
      ...T,
      accent: p.a, onAccent: p.on, accent2: light ? p.deep : p.b,
      modes: modes.map((label, n) => ({
        label,
        style: 'height:40px;border-radius:999px;border:none;font-size:14px;' + (n === s.mode ? 'background:' + p.a + ';color:' + p.on + ';font-weight:600;' : 'background:transparent;color:' + T.muted + ';'),
        pick: () => this.setState({ mode: n })
      })),
      palettes: P.map((x, n) => ({
        ...x,
        border: n === s.pal ? '2px solid ' + x.a : '1px solid ' + T.line,
        pick: () => this.setState({ pal: n })
      }))
    };
  }
}
</script>
</body>
</html>
