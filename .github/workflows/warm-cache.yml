name: "Ночная проверка dev"

# PR CI skips Gradle when the agent's own full check covered the code (Agent-Check: full, scripts/ci/agent-checked.sh),
# and CI on dev skips it for an already checked tree. This is the net: once a night the full `check assembleDebug`
# on dev (it also writes the Gradle cache PRs start from). Skipped when dev has not changed since the last green run.
# Red → an issue «Ночная проверка dev упала» (status:next, type:bug): the next agent sees it in `agent.sh start`.
# release.yml waits for this check to be green on the exact dev commit before releasing (dispatches it if needed).
on:
  schedule:
    - cron: "23 2 * * *" # 02:23 UTC, outside the busy hours
  workflow_dispatch:

concurrency:
  group: warm-cache-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read # gh cache list: was this dev commit already checked
  issues: write # report a red night

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      go: ${{ steps.plan.outputs.go }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci
      - name: Has dev changed since the last green night?
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Schedules run on main, so the dev commit is looked up explicitly. A green night leaves the cache key
        # nightly-dev-<sha> (scripts/ci/nightly-green.sh reads it; release.yml too).
        run: |
          sha=$(gh api "repos/$GH_REPO/commits/dev" -q .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          go=true
          if [ "$GITHUB_EVENT_NAME" = schedule ] && scripts/ci/nightly-green.sh "$sha"; then go=false; fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          [ "$go" = true ] || echo "dev ${sha:0:7} already checked — skipped" | tee -a "$GITHUB_STEP_SUMMARY"

  check:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The same values as ci.yml, so the cache keys match the PR builds.
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      FIREBASE_DATABASE_URL: ${{ vars.FIREBASE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Cache Robolectric android-all
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-
      - name: Lint, unit tests and debug APK
        run: ./gradlew check assembleDebug --console=plain 2>&1 | tee build.log; exit "${PIPESTATUS[0]}"

      - name: Mark this dev commit as checked
        run: mkdir -p .nightly && echo "${{ needs.plan.outputs.sha }}" > .nightly/sha
      - uses: actions/cache/save@v5
        with:
          path: .nightly
          key: nightly-dev-${{ needs.plan.outputs.sha }}

      - name: Report a red night
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          title="Ночная проверка dev упала"
          { echo "Полный \`check assembleDebug\` на \`dev\` (${SHA:0:7}) упал: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Чинить обычным PR в \`dev\`; релиз ждёт зелёной ночной проверки (\`docs/agents/ci.md\`)."
            echo '```'; scripts/agent/build-summary.sh --ci build.log 2>&1 | head -60; echo '```'
            echo; echo '---'; echo '_Generated by [Claude Code](https://claude.ai/code)_'; } > body.md
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[0].number // empty')
          if [ -n "$num" ]; then gh issue comment "$num" --body-file body.md
          else gh issue create --title "$title" --label type:bug --label status:next --label area:reliability --body-file body.md; fi

  # Channel dev (#655, docs/setup/release.md §«Канал dev»): after a green night (or the button) the debug APK of this dev commit
  # goes to the public releases repo as pre-release dev-N; version-dev.json / releases-dev.json live in the rolling pre-release `dev`.
  # `latest` (stable) is not touched. Off until RELEASES_TOKEN is set. No extra build per merge: nightly and button only.
  publish-dev:
    needs: [plan, check]
    if: needs.check.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASES_REPO: ${{ github.repository_owner }}/co-shell-releases
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      HAVE_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      FIREBASE_DATABASE_URL: ${{ vars.FIREBASE_DATABASE_URL }}
    steps:
      - name: No token — channel dev is off
        if: env.HAVE_TOKEN != 'true'
        run: echo "RELEASES_TOKEN is not set — dev channel skipped (docs/setup/release.md)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
        if: env.HAVE_TOKEN == 'true'
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 15
      - uses: actions/setup-java@v6
        if: env.HAVE_TOKEN == 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: env.HAVE_TOKEN == 'true'
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Build debug APK for the dev channel
        if: env.HAVE_TOKEN == 'true'
        env:
          # versionCode grows with every run of this workflow: debug (app.coshell.debug) has its own number line.
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION_NAME: dev.${{ github.run_number }}
          DEV_UPDATE_BASE_URL: https://github.com/${{ github.repository_owner }}/co-shell-releases/releases/download/dev
        run: ./gradlew assembleDebug --console=plain
      - name: Update files
        if: env.HAVE_TOKEN == 'true'
        run: |
          { echo "## dev"; git log -10 --no-merges --format='• %s'; } > dev-notes.md
          curl -fsSL "https://github.com/$RELEASES_REPO/releases/download/dev/releases-dev.json" -o prev-releases.json \
            || echo '[]' > prev-releases.json
          python3 scripts/make-update-files.py app/build/outputs/apk/debug/app-debug.apk \
            "${{ github.run_number }}" "dev.${{ github.run_number }}" dev-notes.md \
            "https://github.com/$RELEASES_REPO/releases/download/dev-${{ github.run_number }}" update-files \
            prev-releases.json --suffix=-dev
      - name: Publish dev-N and move the dev pointer
        if: env.HAVE_TOKEN == 'true'
        run: |
          n=${{ github.run_number }}
          gh release create "dev-$n" "update-files/co-shell-$n.apk" --repo "$RELEASES_REPO" --prerelease --latest=false \
            --title "Dev $n" --notes "Ночная сборка dev ${{ needs.plan.outputs.sha }}. Только для проверки, не стабильная версия."
          gh release view dev --repo "$RELEASES_REPO" >/dev/null 2>&1 || \
            gh release create dev --repo "$RELEASES_REPO" --prerelease --latest=false --title "Dev (указатель)" \
              --notes "Указатель канала dev: version-dev.json и releases-dev.json. Файлы заменяются каждую ночь."
          gh release upload dev update-files/version-dev.json update-files/releases-dev.json --repo "$RELEASES_REPO" --clobber
      - name: Keep the last 20 dev builds
        if: env.HAVE_TOKEN == 'true'
        run: |
          gh release list --repo "$RELEASES_REPO" --limit 200 --json tagName,createdAt \
            -q '[.[] | select(.tagName | test("^dev-[0-9]+$"))] | sort_by(.createdAt) | reverse | .[20:] | .[].tagName' |
            while read -r tag; do gh release delete "$tag" --repo "$RELEASES_REPO" --yes --cleanup-tag; done
