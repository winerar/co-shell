name: "Дополнение «ИИ на телефоне»: APK (#587)"

# Builds ai-addon (the optional APK with the LiteRT-LM engine; the app binds to its service) and publishes it as a pre-release
# `ai-addon-<run>`. By hand only: Actions → this workflow → Run workflow. Not part of the app's CI or release (docs/agents/ci.md).
# Debug-signed with the shared debug key, so it pairs with the debug app (app.coshell.debug); the release add-on (signed with
# the app's release key, published to co-shell-releases for the in-app download) is the next step of #587.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ветка или коммит"
        type: string
        default: dev

permissions:
  contents: write

jobs:
  addon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Build the APK
        run: ./gradlew -p ai-addon assembleDebug --console=plain

      - name: Publish a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp ai-addon/build/outputs/apk/debug/*-debug.apk co-shell-ai-addon.apk
          gh release create "ai-addon-${{ github.run_number }}" co-shell-ai-addon.apk --prerelease \
            --title "AI add-on ${{ github.run_number }}" \
            --notes "Дополнение «ИИ на телефоне» (#587). Ставится рядом с приложением co-shell (подписи должны совпадать)." \
            --target "${{ github.sha }}"
