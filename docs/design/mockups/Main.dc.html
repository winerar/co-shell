<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Шторка ввода операции</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
:root{
--spatial:linear(0,0.06 2.4%,0.22 5.3%,0.5 10.5%,0.74 16%,0.89 21.5%,0.97 27%,1.01 33%,1.02 40%,1.01 50%,1);
--bouncy:linear(0,0.009,0.035 2.1%,0.141,0.281 6.7%,0.723 12.9%,0.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,0.991,0.977 51%,0.974 53.8%,0.975 57.1%,0.997 69.8%,1.003 76.9%,1);
}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tap{transition:transform 520ms var(--bouncy),background-color 260ms ease-out,border-color 260ms ease-out,color 260ms ease-out,box-shadow 260ms ease-out}
.tap:active{transform:scale(0.92);transition:transform 90ms ease-out}
.key{transition:transform 480ms var(--bouncy),background-color 200ms ease-out}
.key:active{transform:scale(0.9);background-color:#3A4434 !important;transition:transform 70ms ease-out,background-color 70ms}
.pill{transition:transform 560ms var(--bouncy)}
.step{transition:transform 560ms var(--spatial),opacity 300ms ease-out}
.pop{animation:pop 520ms var(--bouncy)}
@keyframes pop{0%{transform:scale(0.6);opacity:0}100%{transform:scale(1);opacity:1}}
.digit{display:inline-block;animation:dig 380ms var(--spatial)}
@keyframes dig{0%{transform:translateY(60%);opacity:0}100%{transform:none;opacity:1}}
.scroll{overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #050805; font-family: Onest, system-ui, sans-serif; color: #EEF5E6; position: relative; overflow: hidden;">
  <div style="position: absolute; inset: 0; padding: 16px; opacity: 0.35;">
    <div style="font-size: 30px; font-weight: 700; margin-top: 8px;">Обзор</div>
    <div style="margin-top: 16px; height: 140px; border-radius: 16px; background: linear-gradient(135deg, #B8FF2E, #00F0FF);"></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.6);"></div>

  <div style="position: absolute; left: 0; right: 0; top: 56px; bottom: 0; background: #11170E; border-radius: 28px 28px 0 0; overflow: hidden;">
    <div style="display: flex; justify-content: center; padding-top: 10px;">
      <div style="width: 36px; height: 4px; border-radius: 2px; background: #4A5444;"></div>
    </div>

    <!-- ШАГ 1: тип и счёт -->
    <div class="step" style="{{step1Style}}">
      <div style="padding: 12px 16px 0;">
        <div style="position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 4px; border-radius: 999px; background: #1B2317;">
          <div class="pill" style="{{pillStyle}}"></div>
          <sc-for list="{{types}}" as="t" hint-placeholder-count="3">
            <button type="button" class="tap" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
          </sc-for>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 16px;">
          <span style="font-size: 20px; font-weight: 700;">{{question}}</span>
          <span style="font-size: 12px; color: #9AA594;">12 счетов</span>
        </div>
      </div>

      <div class="scroll" style="position: absolute; top: 118px; bottom: 76px; left: 0; right: 0; padding: 0 16px 12px;">
        <div style="font-size: 12px; font-weight: 600; color: #B8FF2E; letter-spacing: 0.06em; margin: 8px 0;">НЕДАВНИЕ</div>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
          <sc-for list="{{recent}}" as="a" hint-placeholder-count="4">
            <button type="button" class="tap" onClick="{{a.pick}}" style="{{a.bigStyle}}">
              <span style="width: 44px; height: 44px; border-radius: 14px; background: {{a.color}}; color: {{a.ink}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700;">{{a.ini}}</span>
              <span style="font-size: 12px; color: #EEF5E6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;">{{a.name}}</span>
            </button>
          </sc-for>
        </div>
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
          <div style="font-size: 12px; font-weight: 600; color: #9AA594; letter-spacing: 0.06em; margin: 16px 0 8px;">{{g.title}}</div>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
            <sc-for list="{{g.items}}" as="a" hint-placeholder-count="3">
              <button type="button" class="tap" onClick="{{a.pick}}" style="{{a.tileStyle}}">
                <span style="width: 32px; height: 32px; border-radius: 10px; background: {{a.color}}; color: {{a.ink}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;">{{a.ini}}</span>
                <span style="font-size: 13px; font-weight: 600; color: #EEF5E6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;">{{a.name}}</span>
                <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9AA594; white-space: nowrap;">{{a.bal}}</span>
              </button>
            </sc-for>
          </div>
        </sc-for>
      </div>

      <div style="position: absolute; left: 16px; right: 16px; bottom: 16px;">
        <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-radius: 999px; background: #1B2317;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9AA594" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
          <input type="search" placeholder="Найти счёт" style="flex-grow: 1; background: none; border: none; outline: none; color: #EEF5E6; font-family: inherit; font-size: 15px;">
        </label>
      </div>
    </div>

    <!-- ШАГ 2: сумма, категория, своя клавиатура -->
    <div class="step" style="{{step2Style}}">
      <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 12px 14px; display: flex; flex-direction: column; gap: 12px;">
        <div style="display: flex; align-items: center; gap: 8px; padding: 0 4px;">
          <button type="button" class="tap" onClick="{{back}}" style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 14px 0 6px; border-radius: 999px; border: 1px solid #2E382A; background: #161D12; color: #EEF5E6;">
            <span style="width: 34px; height: 34px; border-radius: 11px; background: {{acc.color}}; color: {{acc.ink}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;">{{acc.ini}}</span>
            <span style="display: flex; flex-direction: column; align-items: flex-start;">
              <span style="font-size: 14px; font-weight: 600;">{{acc.name}}</span>
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9AA594;">{{acc.bal}}</span>
            </span>
            <span style="color: #9AA594; margin-left: 4px;">▾</span>
          </button>
          <span style="flex-grow: 1;"></span>
          <span style="font-size: 13px; font-weight: 600; color: {{amountColor}};">{{typeLabel}}</span>
        </div>

        <div style="display: flex; align-items: baseline; justify-content: center; gap: 8px; min-height: 64px; overflow: hidden;">
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 48px; font-weight: 700; color: {{amountColor}};">
            <sc-for list="{{digits}}" as="d" hint-placeholder-count="3"><span class="digit">{{d}}</span></sc-for>
          </span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 18px; color: #9AA594;">{{acc.cur}}</span>
        </div>

        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px;">
          <sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
            <button type="button" class="tap" onClick="{{c.pick}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; background: none; border: none;">
              <span class="tap" style="{{c.ring}}">
                <span style="width: 40px; height: 40px; border-radius: 50%; background: {{c.color}}; display: flex; align-items: center; justify-content: center;">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E1F00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg>
                </span>
              </span>
              <span style="font-size: 12px; color: {{c.text}}; white-space: nowrap;">{{c.name}}</span>
            </button>
          </sc-for>
        </div>

        <div style="display: flex; gap: 8px; padding: 0 4px;">
          <button type="button" class="tap" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #2E382A; background: #1B2317; color: #EEF5E6; font-size: 13px;">Сегодня ▾</button>
          <button type="button" class="tap" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #2E382A; background: transparent; color: #C9D3C2; font-size: 13px;">＋ Заметка</button>
          <button type="button" class="tap" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #2E382A; background: transparent; color: #C9D3C2; font-size: 13px;">Чек в др. валюте</button>
        </div>

        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 54px; gap: 6px;">
          <button type="button" class="key" onClick="{{k.n7}}" style="border: none; border-radius: 16px; background: #1F271B; color: #EEF5E6; font-size: 22px; font-family: 'JetBrains Mono', monospace;">7</button>
          <button type="button" class="key" onClick="{{k.n8}}" style="border: none; border-radius: 16px; background: #1F271B; color: #EEF5E6; font-size: 22px; font-family: 'JetBrains Mono', monospace;">8</button>
          <button type="button" class="key" onClick="{{k.n9}}" style="border: none; border-radius: 16px; background: #1F271B; color: #EEF5E6; font-size: 22px; font-family: 'JetBrains Mono', monospace;">9</button>
          <button type="button" class="key" onClick="{{k.del}}" aria-label="Стереть" style="border: none; border-radius: 16px; background: #2A3326; color: #EEF5E6; font-size: 20px;">⌫</button>
          <button type="button" class="key" onClick="{{k.n4}}" style="border: none; border-radius: 16px; background: #1F271B; color: #EEF5E6; font-size: 22px; font-family: 'JetBrains Mono', monospace;">4</button>
          <button type="button" class="key" onClick="{{k.n5}}" style="border: none; border-radius: 16px; background: #1F271B; color: #EEF5E6; font-size: 22px; font-family: 'JetBrains Mono', monospace;">5</button>
          <button type="button" class="key" onClick="{{k.n6}}" style="border: none; border-radius: 16px; background: #1F271B; color: #EEF5E6; font-size: 22px; font-family: 'JetBrains Mono', monospace;">6</button>
          <button type="button" class="key" onClick="{{k.plus}}" aria-label="Плюс" style="border: none; border-radius: 16px; background: #2A3326; color: #B8FF2E; font-size: 24px;">+</button>
          <button type="button" class="key" onClick="{{k.n1}}" style="border: none; border-radius: 16px; background: #1F271B; color: #EEF5E6; font-size: 22px; font-family: 'JetBrains Mono', monospace;">1</button>
          <button type="button" class="key" onClick="{{k.n2}}" style="border: none; border-radius: 16px; background: #1F271B; color: #EEF5E6; font-size: 22px; font-family: 'JetBrains Mono', monospace;">2</button>
          <button type="button" class="key" onClick="{{k.n3}}" style="border: none; border-radius: 16px; background: #1F271B; color: #EEF5E6; font-size: 22px; font-family: 'JetBrains Mono', monospace;">3</button>
          <button type="button" class="key" onClick="{{k.save}}" style="grid-row: span 2; border: none; border-radius: 18px; background: #B8FF2E; color: #0E1F00; font-size: 15px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0E1F00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
            Готово
          </button>
          <button type="button" class="key" onClick="{{k.comma}}" style="border: none; border-radius: 16px; background: #1F271B; color: #EEF5E6; font-size: 22px; font-family: 'JetBrains Mono', monospace;">,</button>
          <button type="button" class="key" onClick="{{k.n0}}" style="border: none; border-radius: 16px; background: #1F271B; color: #EEF5E6; font-size: 22px; font-family: 'JetBrains Mono', monospace;">0</button>
          <button type="button" class="key" onClick="{{k.n000}}" style="border: none; border-radius: 16px; background: #1F271B; color: #EEF5E6; font-size: 18px; font-family: 'JetBrains Mono', monospace;">000</button>
        </div>
      </div>
    </div>

    <sc-if value="{{saved}}" hint-placeholder-val="{{false}}">
      <div class="pop" style="position: absolute; left: 50%; top: 40%; margin-left: -70px; width: 140px; height: 140px; border-radius: 50%; background: #B8FF2E; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #0E1F00; font-weight: 700; gap: 4px;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#0E1F00" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
        Сохранено
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 1, type: 'exp', acc: 'galicia', cat: 'food', amount: '', saved: false };
  }
  ink(hex) {
    const n = parseInt(hex.slice(1), 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
    return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#111611' : '#FFFFFF';
  }
  fmt(s) {
    return s.split(' + ').map((p) => {
      const [i, f] = p.split(',');
      const ii = (i || '').replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
      return f !== undefined ? ii + ',' + f : ii;
    }).join(' + ');
  }
  renderVals() {
    const s = this.state;
    const A = [
      ['galicia', 'Galicia', 'GA', '#F26E22', '1 250 000 ARS', 'ARS', 'card'],
      ['mp', 'Mercado Pago', 'MP', '#00B1EA', '96 400 ARS', 'ARS', 'card'],
      ['santander', 'Santander', 'SA', '#EC0000', '310 000 ARS', 'ARS', 'card'],
      ['ameria', 'Ameria', 'AM', '#B01E2F', '410 000 AMD', 'AMD', 'card'],
      ['ineco', 'Inecobank', 'IN', '#0096D6', '120 000 AMD', 'AMD', 'card'],
      ['tbank', 'Т-Банк', 'Т', '#FFDD2D', '18 500 RUB', 'RUB', 'card'],
      ['binance', 'Binance', 'BN', '#F0B90B', '1 840 USDT', 'USDT', 'crypto'],
      ['bybit', 'Bybit Card', 'BY', '#F7A600', '470 USDT', 'USDT', 'crypto'],
      ['cashars', 'Наличные', '₱', '#A8FF3E', '85 000 ARS', 'ARS', 'cash'],
      ['cashusd', 'Доллары', '$', '#00E5C0', '1 300 USD', 'USD', 'cash'],
      ['cashamd', 'Драмы', '֏', '#D36BFF', '52 000 AMD', 'AMD', 'cash'],
      ['deposit', 'Вклад', 'ВК', '#6E8BFF', '3 000 USD', 'USD', 'save']
    ].map(([id, name, ini, color, bal, cur, grp]) => ({ id, name, ini, color, bal, cur, grp, ink: this.ink(color) }));
    const sel = (id) => id === s.acc;
    const pick = (id) => () => this.setState({ acc: id, step: 2 });
    const tile = (a) => 'display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:10px;min-height:92px;box-sizing:border-box;border-radius:16px;text-align:left;min-width:0;' +
      (sel(a.id) ? 'background:#1F2A17;border:2px solid ' + a.color + ';' : 'background:#161D12;border:2px solid #222B1E;');
    const big = (a) => 'display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 2px;border-radius:16px;min-width:0;background:none;' +
      (sel(a.id) ? 'border:2px solid ' + a.color + ';' : 'border:2px solid transparent;');
    const withUi = (a) => ({ ...a, pick: pick(a.id), tileStyle: tile(a), bigStyle: big(a) });
    const byId = (id) => withUi(A.find((a) => a.id === id));
    const G = [['card', 'КАРТЫ И БАНКИ'], ['crypto', 'КРИПТО'], ['cash', 'НАЛИЧНЫЕ'], ['save', 'ВКЛАДЫ']];
    const groups = G.map(([g, title]) => ({ title, items: A.filter((a) => a.grp === g).map(withUi) }));
    const recent = ['galicia', 'binance', 'cashars', 'mp'].map(byId);

    const P = {
      cart: 'M3 4h2l2.4 11h11l2-8H6.5M9 20h.01M17 20h.01',
      cup: 'M4 8h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM17 9h2a2 2 0 0 1 0 4h-2M8 3v2M12 3v2',
      car: 'M5 16V11l2-5h10l2 5v5M3 16h18M7 19v-3M17 19v-3M7 11h10',
      pill: 'M10 4.5a4.95 4.95 0 0 1 7 7l-6 6a4.95 4.95 0 0 1-7-7zM7.5 9.5l7 7',
      house: 'M4 11l8-7 8 7M6 10v10h12V10M10 20v-6h4v6',
      bread: 'M5 11a4 4 0 0 1 2-7.5h10A4 4 0 0 1 19 11v9H5zM9 11v6M15 11v6',
      bag: 'M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2',
      more: 'M5 12h.01M12 12h.01M19 12h.01',
      case: 'M4 8h16v11H4zM9 8V5h6v3M4 13h16',
      gift: 'M4 10h16v4H4zM6 14v6h12v-6M12 10v10M12 10c-2-4-6-3-5-1M12 10c2-4 6-3 5-1',
      pct: 'M6 18L18 6M7.5 7.5h.01M16.5 16.5h.01',
      swap: 'M4 8h14l-3-3M20 16H6l3 3'
    };
    const exp = [['food', 'Продукты', '#A8FF3E', 'cart'], ['cafe', 'Кафе', '#FFC46B', 'cup'], ['taxi', 'Такси', '#F5FF3D', 'car'], ['pharm', 'Аптека', '#FF8FA3', 'pill'], ['home', 'Дом', '#38B6FF', 'house'], ['bakery', 'Пекарня', '#D9A066', 'bread'], ['shop', 'Покупки', '#D36BFF', 'bag'], ['all', 'Все', '#7A8494', 'more']];
    const inc = [['salary', 'Зарплата', '#2BE4FF', 'case'], ['gift', 'Подарки', '#9D7BFF', 'gift'], ['cb', 'Кэшбэк', '#A8FF3E', 'pct'], ['all', 'Все', '#7A8494', 'more']];
    const tr = [['tr', 'Перевод', '#9D7BFF', 'swap']];
    const list = s.type === 'inc' ? inc : s.type === 'tr' ? tr : exp;
    const cats = list.map(([id, name, color, icon]) => {
      const on = id === s.cat;
      return {
        name, color, icon: P[icon], text: on ? '#EEF5E6' : '#9AA594',
        ring: 'display:flex;padding:3px;border-radius:50%;border:2px solid ' + (on ? color : 'transparent') + ';transform:scale(' + (on ? 1.08 : 1) + ');',
        pick: () => this.setState({ cat: id })
      };
    });
    const T = [['exp', 'Расход'], ['inc', 'Доход'], ['tr', 'Перевод']];
    const ti = T.findIndex(([id]) => id === s.type);
    const types = T.map(([id, label]) => ({
      label,
      style: 'position:relative;z-index:1;height:40px;border:none;border-radius:999px;font-size:14px;font-weight:600;background:transparent;color:' + (id === s.type ? '#0E1F00' : '#C9D3C2') + ';',
      pick: () => this.setState({ type: id, cat: id === 'inc' ? 'salary' : id === 'tr' ? 'tr' : 'food' })
    }));
    const add = (t) => () => {
      let a = s.amount;
      if (t === 'del') { a = a.endsWith(' + ') ? a.slice(0, -3) : a.slice(0, -1); }
      else if (t === '+') { if (a && !a.endsWith(' + ')) a += ' + '; }
      else if (t === ',') { const last = a.split(' + ').pop(); if (!last.includes(',')) a += (last ? ',' : '0,'); }
      else { if (a.replace(/\D/g, '').length < 12) a += t; }
      this.setState({ amount: a });
    };
    const save = () => {
      this.setState({ saved: true });
      setTimeout(() => this.setState({ saved: false, step: 1, amount: '' }), 900);
    };
    const shown = s.amount ? this.fmt(s.amount) : '0';
    const sign = s.type === 'exp' ? '−' : s.type === 'inc' ? '+' : '';
    const acc = byId(s.acc);
    return {
      types, recent, groups, cats, acc,
      pillStyle: 'position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / 3);border-radius:999px;background:#B8FF2E;transform:translateX(' + (ti * 100) + '%);',
      step1Style: 'position:absolute;inset:24px 0 0 0;transform:translateX(' + (s.step === 1 ? '0' : '-30%') + ');opacity:' + (s.step === 1 ? 1 : 0) + ';pointer-events:' + (s.step === 1 ? 'auto' : 'none') + ';',
      step2Style: 'position:absolute;inset:24px 0 0 0;transform:translateX(' + (s.step === 2 ? '0' : '30%') + ');opacity:' + (s.step === 2 ? 1 : 0) + ';pointer-events:' + (s.step === 2 ? 'auto' : 'none') + ';',
      question: s.type === 'inc' ? 'Куда пришло?' : s.type === 'tr' ? 'Откуда перевод?' : 'Откуда списали?',
      typeLabel: T[ti][1],
      amountColor: s.type === 'exp' ? '#FF5C7F' : s.type === 'inc' ? '#00F0FF' : '#EEF5E6',
      digits: (sign + shown).split(''),
      back: () => this.setState({ step: 1 }),
      saved: s.saved,
      k: {
