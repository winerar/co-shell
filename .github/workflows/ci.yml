name: "Сборка и тесты (CI)"

on:
  push:
    branches: [main, dev] # dev: checks only; releases are published from main
  pull_request:
    # ready_for_review: an agent's draft PR is built once, when the agent marks it ready (#253).
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: # Actions → «Сборка и тесты (CI)» → Run workflow (e.g. first deploy after adding secrets)

# One group per branch: the dispatch from auto-pr.yml (refs/heads/<branch>) and the pull_request run
# (refs/pull/N/merge) of the same commit used to run side by side; now the newer one cancels the older.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write # publish releases
  actions: write # dev: look up the CI run of the merged PR head, dispatch warm-cache.yml
  pull-requests: write # failure summary comment on the PR; automerge of agent PRs
  issues: write # automerge closes the issues from `Fixes #N`

jobs:
  build:
    # Draft PRs are not built: an agent pushes many commits per session, only the last one matters, and every
    # run costs Actions minutes of the private repo (#253). Marking the PR ready runs CI (ready_for_review).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Self-update turns on once the owner adds the release key and RELEASES_TOKEN secrets
      # (docs/setup/self-update.md). Until then only the debug APK is published.
      SELF_UPDATE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.RELEASE_KEYSTORE_BASE64 != '' && secrets.RELEASES_TOKEN != '' }}
      # Public repo with only APKs and version.json (the main repo is private).
      RELEASES_REPO: ${{ github.repository_owner }}/co-shell-releases
      # Feedback form → Firestore (docs/setup/feedback.md); empty → the form says "not configured".
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      FIREBASE_DATABASE_URL: ${{ vars.FIREBASE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # to diff against the base branch (docs-only check below)

      # Changes only in docs/, *.md and the agent's own scripts (scripts/agent/: not part of the build, not tested
      # here) skip Gradle on PRs and dev; main always builds (it releases).
      # dev: a merge whose tree equals the PR head that already had a green CI run is not rebuilt —
      # the same files were just checked (automerge merges only after a green run).
      - name: Detect code changes
        id: changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          code=true
          if [ "$GITHUB_REF" = refs/heads/dev ] && scripts/ci/tree-already-checked.sh; then
            code=false
            # PRs start from the Gradle cache that dev writes: refresh it without holding this run.
            gh workflow run warm-cache.yml --ref dev || echo "::warning::could not dispatch warm-cache.yml"
          elif [ "$GITHUB_REF" != refs/heads/main ] && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] \
             && git rev-parse -q --verify "$BASE^{commit}" >/dev/null; then
            changed=$(git diff --name-only "$BASE"...HEAD)
            echo "$changed"
            if [ -n "$changed" ] && ! echo "$changed" | grep -qvE '^docs/|\.md$|^scripts/agent/'; then code=false; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code"

      - uses: actions/setup-java@v6
        if: steps.changes.outputs.code == 'true'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        if: steps.changes.outputs.code == 'true'
        with:
          # dev writes the cache too (by default only the default branch does): PRs into dev start warm.
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}
          # Optional secret; with it the configuration cache is saved as well (docs/agents/build-and-test.md).
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Script tests
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 -m unittest discover -s scripts/ci -p 'test_*.py'

      # main: the same tree was already checked by the dev → main PR, so lint and tests are skipped.
      # Robolectric (MainShellSmokeTest) downloads android-all (~160 MB) into ~/.m2 at test time,
      # outside the Gradle cache. main runs no tests, so it neither needs nor writes this cache.
      - name: Cache Robolectric android-all
        if: steps.changes.outputs.code == 'true' && github.ref != 'refs/heads/main'
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-

      - name: Lint, unit tests and debug APK
        if: steps.changes.outputs.code == 'true' && github.ref != 'refs/heads/main'
        # The log goes to build.log for the failure summary below (scripts/agent/build-summary.sh).
        # No BUILD_NUMBER here: versionCode goes into BuildConfig and the manifest, and a new number every
        # run made every :app task (compile, ksp, hilt, tests, lint) miss the build cache — 88 of 144 tasks
        # ran on a scripts-only PR (run 320). PR APKs get versionCode 1; main still numbers its builds.
        run: ./gradlew check assembleDebug --console=plain 2>&1 | tee build.log; exit "${PIPESTATUS[0]}"

      # main: debug and signed release in ONE Gradle call — with the configuration cache their tasks run
      # in parallel (two calls ran them one after another: 2:00 + 3:47, run 318).
      # Version name 0.N: N = merges into main, i.e. releases (#268); like BUILD_NUMBER, only on main.
      - name: Version name (main)
        if: github.ref == 'refs/heads/main'
        run: echo "VERSION_NAME=$(python3 scripts/ci/version_name.py)" | tee -a "$GITHUB_ENV"

      - name: Build APKs (main)
        if: github.ref == 'refs/heads/main'
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          tasks=(assembleDebug)
          if [ "$SELF_UPDATE" = true ]; then
            export RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            export UPDATE_BASE_URL="https://github.com/$RELEASES_REPO/releases/latest/download"
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RELEASE_KEYSTORE_FILE"
            tasks+=(assembleRelease)
          fi
          ./gradlew "${tasks[@]}" --console=plain 2>&1 | tee build.log; status=${PIPESTATUS[0]}
          rm -f "$RUNNER_TEMP/release.jks"
          exit "$status"

      - name: Upload debug APK
        if: steps.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: co-shell-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Update files
        if: env.SELF_UPDATE == 'true'
        run: |
          python3 scripts/make-update-files.py app/build/outputs/apk/release/app-release.apk \
            "${{ github.run_number }}" "$VERSION_NAME" docs/whats-new.md \
            "https://github.com/$RELEASES_REPO/releases/download/build-${{ github.run_number }}" update-files
          cp app/build/outputs/apk/release/app-release.apk co-shell.apk

      # The app reads .../releases/latest/download/version.json from the public releases repo.
      - name: Publish update
        if: env.SELF_UPDATE == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" update-files/* \
            --repo "$RELEASES_REPO" \
            --title "Сборка ${{ github.run_number }}" \
            --notes-file <(python3 -c 'import json; print(json.load(open("update-files/version.json"))["notes"])') \
            --latest

      # Every merge to main becomes a release with a fixed file name, so the newest APK is always at
      # https://github.com/winerar/co-shell/releases/latest/download/co-shell-debug.apk
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          # A dispatched run (Release button, automerge) has no head_commit — take the merge commit.
          [ -n "$NOTES" ] || NOTES=$(git log -1 --format=%B)
          cp app/build/outputs/apk/debug/app-debug.apk co-shell-debug.apk
          files=(co-shell-debug.apk)
          # co-shell.apk (release) is for the first manual install; later ones come by self-update.
          [ -f co-shell.apk ] && files+=(co-shell.apk)
          gh release create "build-${{ github.run_number }}" "${files[@]}" \
            --target "${{ github.sha }}" \
            --title "Сборка ${{ github.run_number }}" \
            --notes "$NOTES" \
            --latest

      # A short report instead of thousands of log lines: the job summary and one comment on the PR
      # (updated in place) — an agent reads it with pull_request_read instead of get_job_logs.
      - name: Failure summary
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          { echo '<!-- ci-summary -->'; echo "### CI failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo '```'; scripts/agent/build-summary.sh --ci build.log 2>&1 | head -80; echo '```'
            echo; echo '---'; echo '_Generated by [Claude Code](https://claude.ai/code)_'; } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          [ -n "$PR" ] || exit 0
          api="repos/${{ github.repository }}/issues/$PR/comments"
          id=$(gh api "$api" --paginate -q '.[] | select(.body | startswith("<!-- ci-summary -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@summary.md >/dev/null
          else
            gh api "$api" -F body=@summary.md >/dev/null
          fi

      - name: Mark an old failure summary as fixed
        if: success() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --paginate \
            -q '.[] | select(.body | startswith("<!-- ci-summary -->")) | .id' | head -1)
          [ -z "$id" ] || gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" \
            -f body="<!-- ci-summary -->
          ✓ CI зелёный на ${{ github.event.pull_request.head.sha }} (прошлая ошибка исправлена)." >/dev/null

      # A run started by GITHUB_TOKEN (the dispatch from auto-pr.yml) fires no workflow_run, so automerge.yml
      # never hears that it finished: a PR marked ready while CI was running stayed open (#223, #229).
      # The green run hands the PR to the same script itself; it skips drafts, `hold`, non-agent branches.
      - name: Merge the agent PR into dev
        if: success() && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CI_GREEN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/automerge.sh "${{ github.head_ref || github.ref_name }}" || echo "::warning::automerge failed"

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/outputs/roborazzi/
