# Version name of release builds: <major>.<minor>. Computed by scripts/ci/version_name.py on main (CI → VERSION_NAME).
# The only manual step is raising `major`: the release that carries the new number becomes <major>.0, each next
# release (a merge dev → main) is <major>.1, <major>.2, ... No offsets to compute (ci.md §«Номер версии»).
major=1
