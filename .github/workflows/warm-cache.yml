name: "Прогрев кэша Gradle на dev"

# PRs into dev start from the Gradle cache written on dev. When CI on dev skips Gradle (the merged tree
# was already checked in the PR — scripts/ci/tree-already-checked.sh), ci.yml dispatches this workflow:
# the same `check assembleDebug` refreshes the cache, but the release button does not wait for it.
on:
  workflow_dispatch:

concurrency:
  group: warm-cache-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The same values as ci.yml, so the cache keys match the PR builds.
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      FIREBASE_DATABASE_URL: ${{ vars.FIREBASE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Cache Robolectric android-all
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-
      - name: Lint, unit tests and debug APK
        run: ./gradlew check assembleDebug --console=plain
