<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Категории</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
:root{--bouncy:linear(0,0.009,0.035 2.1%,0.141,0.281 6.7%,0.723 12.9%,0.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,0.991,0.977 51%,0.974 53.8%,0.975 57.1%,0.997 69.8%,1.003 76.9%,1);--spatial:linear(0,0.06 2.4%,0.22 5.3%,0.5 10.5%,0.74 16%,0.89 21.5%,0.97 27%,1.01 33%,1.02 40%,1.01 50%,1)}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tap{transition:transform 520ms var(--bouncy),background-color 300ms ease-out,color 300ms ease-out}
.tap:active{transform:scale(0.97);transition:transform 90ms ease-out}
.chev{transition:transform 420ms var(--spatial)}
.rise{animation:rise 420ms var(--spatial)}
@keyframes rise{0%{transform:translateY(-8px);opacity:0}100%{transform:none;opacity:1}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #050805; font-family: Onest, system-ui, sans-serif; color: #EEF5E6; position: relative; overflow: hidden; padding: 16px 16px 0;">
  <div style="display: flex; align-items: center; gap: 4px; margin: 4px -8px 0;">
    <button type="button" class="tap" aria-label="Назад" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: transparent; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#EEF5E6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <h1 style="margin: 0; font-size: 22px; font-weight: 700; flex-grow: 1;">Категории</h1>
  </div>

  <div role="tablist" style="margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 999px; background: #10160D; border: 1px solid #222B1E;">
    <button type="button" role="tab" class="tap" onClick="{{toExpense}}" style="{{expenseTab}}">Расходы</button>
    <button type="button" role="tab" class="tap" onClick="{{toIncome}}" style="{{incomeTab}}">Доходы</button>
  </div>

  <div style="margin-top: 14px; display: flex; flex-direction: column; gap: 8px; height: 640px; overflow: hidden;">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <div style="border-radius: 16px; background: #10160D; border: 1px solid {{r.border}}; overflow: hidden;">
        <button type="button" class="tap" onClick="{{r.toggle}}" style="width: 100%; min-height: 60px; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: none; background: transparent; color: #EEF5E6; text-align: left;">
          <span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; background: {{r.color}}; display: flex; align-items: center; justify-content: center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B0F0A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg>
          </span>
          <span style="display: flex; flex-direction: column; flex-grow: 1; gap: 2px;">
            <span style="font-size: 16px; font-weight: 600;">{{r.name}}</span>
            <span style="font-size: 12px; color: #9AA594;">{{r.sub}}</span>
          </span>
          <sc-if value="{{r.folder}}" hint-placeholder-val="{{true}}">
            <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9AA594" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="transform: rotate({{r.turn}}deg);"><path d="M6 9l6 6 6-6"></path></svg>
          </sc-if>
        </button>
        <sc-if value="{{r.open}}" hint-placeholder-val="{{false}}">
          <div class="rise" style="display: flex; flex-wrap: wrap; gap: 8px; padding: 0 12px 12px 64px;">
            <sc-for list="{{r.kids}}" as="k" hint-placeholder-count="3">
              <span style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px 0 4px; border-radius: 999px; background: #161D12; font-size: 13px;">
                <span style="width: 26px; height: 26px; border-radius: 50%; background: {{r.color}}; opacity: 0.85;"></span>{{k}}
              </span>
            </sc-for>
            <span style="display: inline-flex; align-items: center; height: 34px; padding: 0 12px; border-radius: 999px; border: 1px dashed #2E382A; font-size: 13px; color: #B8FF2E;">+ В папку</span>
          </div>
        </sc-if>
      </div>
    </sc-for>
    <div style="padding: 6px 4px; font-size: 13px; color: #9AA594;">Показать архивные (2)</div>
  </div>

  <button type="button" class="tap" style="position: absolute; right: 16px; bottom: 24px; height: 56px; padding: 0 22px 0 18px; border-radius: 999px; border: none; background: #B8FF2E; color: #0E1F00; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E1F00" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Добавить</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'e', open: { food: true } }; }
  renderVals() {
    const s = this.state;
    const I = {
      cart: 'M3 4h2l2 11h11l2-8H7M9 20a1 1 0 1 0 0-2M17 20a1 1 0 1 0 0-2',
      home: 'M4 11l8-7 8 7v9H4z',
      car: 'M5 16h14M6 16l1.5-5h9L18 16M7 19v-3M17 19v-3',
      heart: 'M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z',
      game: 'M6 9h12a3 3 0 0 1 3 3v2a3 3 0 0 1-5 2l-1-1H9l-1 1a3 3 0 0 1-5-2v-2a3 3 0 0 1 3-3z',
      plane: 'M3 13l18-7-7 18-2-8z',
      cash: 'M3 7h18v10H3zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
      gift: 'M4 10h16v10H4zM12 10v10M3 7h18v3H3zM12 7c-2-4-6-3-4 0M12 7c2-4 6-3 4 0',
      chart: 'M4 17l5-5 4 4 7-8'
    };
    const expense = [
      { id: 'food', name: 'Еда', sub: '4 категории', color: '#B8FF2E', icon: I.cart, kids: ['Продукты', 'Кафе', 'Пекарня', 'Доставка'] },
      { id: 'home', name: 'Дом', sub: '3 категории', color: '#00F0FF', icon: I.home, kids: ['Аренда', 'Счета', 'Ремонт'] },
      { id: 'car', name: 'Транспорт', sub: '3 категории', color: '#FFC46B', icon: I.car, kids: ['Такси', 'Бензин', 'Поезд'] },
      { id: 'h', name: 'Здоровье', sub: 'без папки', color: '#FF8FA3', icon: I.heart },
      { id: 'g', name: 'Развлечения', sub: 'без папки', color: '#B266FF', icon: I.game },
      { id: 'p', name: 'Отпуск', sub: 'без папки', color: '#FF8A5C', icon: I.plane }
    ];
    const income = [
      { id: 'sal', name: 'Зарплата', sub: 'без папки', color: '#00F0FF', icon: I.cash },
      { id: 'side', name: 'Подработки', sub: '2 категории', color: '#B8FF2E', icon: I.chart, kids: ['Фриланс', 'Продажи'] },
      { id: 'gift', name: 'Подарки', sub: 'без папки', color: '#FFE600', icon: I.gift }
    ];
    const list = s.tab === 'e' ? expense : income;
    const on = 'height:40px;border-radius:999px;border:none;background:#B8FF2E;color:#0E1F00;font-size:15px;font-weight:600;';
    const off = 'height:40px;border-radius:999px;border:none;background:transparent;color:#9AA594;font-size:15px;font-weight:500;';
    return {
      expenseTab: s.tab === 'e' ? on : off,
      incomeTab: s.tab === 'i' ? on : off,
      toExpense: () => this.setState({ tab: 'e' }),
      toIncome: () => this.setState({ tab: 'i' }),
      rows: list.map(r => {
        const folder = !!r.kids, open = folder && !!s.open[r.id];
        return {
          name: r.name, sub: r.sub, color: r.color, icon: r.icon, folder, open,
          kids: r.kids || [], turn: open ? 180 : 0,
          border: open ? '#3A4A1E' : '#222B1E',
          toggle: () => { if (folder) this.setState({ open: { ...s.open, [r.id]: !s.open[r.id] } }); }
        };
      })
    };
  }
}
</script>
</body>
</html>
