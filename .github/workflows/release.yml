name: "Релиз: выкатить dev на телефоны"

# Weekly (from RELEASES_FROM, Mondays): a release of everything accumulated in dev; skipped when dev has nothing but
# docs (scripts/ci/release_needed.py). Before the merge the R8 build runs on an emulator (emulator.yml).
# Owner's button: Actions → «Релиз: выкатить dev на телефоны» → Run workflow. Creates (or updates) the PR dev → main with the
# family section of docs/whats-new.md, the merged PRs and `Fixes #N`, merges it and dispatches CI on
# main, which publishes the build to the phones. A merge made with GITHUB_TOKEN does not trigger push
# workflows — hence the explicit dispatch. Setup and details: docs/setup/release.md.
on:
  schedule:
    - cron: "17 5 * * 1" # Monday 05:17 UTC (schedules run from the copy in main)
  workflow_dispatch:
    inputs:
      skip_emulator:
        description: "Без проверки в эмуляторе (срочный выпуск)"
        type: boolean
        default: false
      pr_only:
        description: "Только создать PR dev → main, не вливать"
        type: boolean
        default: false
      allow_no_whats_new:
        description: "Выпустить без нового раздела в whats-new.md"
        type: boolean
        default: false
      allow_no_stories:
        description: "Выпустить без новых историй релиза (#693)"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.plan.outputs.go }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Is a release needed?
        id: plan
        env:
          RELEASES_FROM: "2026-12-01" # weekly releases start in December (owner, 2026-11-16)
        run: |
          go=true
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            git fetch -q origin main dev
            if [[ "$(date -u +%F)" < "$RELEASES_FROM" ]]; then
              go=false; echo "Weekly releases start $RELEASES_FROM"
            elif [ "$(git rev-list --no-merges --count origin/main..origin/dev)" -eq 0 ]; then
              go=false; echo "dev has no new commits"
            else
              go=$(git diff --name-only origin/main...origin/dev | python3 scripts/ci/release_needed.py)
              [ "$go" = true ] || echo "dev has only docs changes"
            fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          [ "$go" = true ] || echo "Release skipped: nothing to ship" | tee -a "$GITHUB_STEP_SUMMARY"

  emulator:
    needs: plan
    if: needs.plan.outputs.go == 'true' && !inputs.skip_emulator
    uses: ./.github/workflows/emulator.yml
    with:
      ref: dev

  release:
    needs: [plan, emulator]
    # The emulator is skipped only by the owner's tick; a failed emulator stops the release.
    if: ${{ !cancelled() && needs.plan.outputs.go == 'true' && (needs.emulator.result == 'success' || needs.emulator.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Anything to release?
        run: |
          git fetch -q origin main dev
          count=$(git rev-list --no-merges --count origin/main..origin/dev)
          echo "Commits in dev not in main: $count"
          [ "$count" -gt 0 ] || { echo "::error::Nothing to release: dev has no new commits"; exit 1; }

      # Automerge dispatches CI on dev right after a merge, and ci.yml cancels the older run of the same
      # ref (concurrency); both runs can have the same creation time, so «the latest run» may be the
      # cancelled one (runs 9–10, 2026-11-11). Pick by state: a green run, else a running one, else a
      # failed one; a cancelled run only counts when there is nothing else.
      - name: CI on dev is green
        run: |
          sha=$(git rev-parse origin/dev)
          pick() {
            gh run list --workflow ci.yml --commit "$sha" --limit 20 --json databaseId,status,conclusion -q '
              ([.[] | select(.conclusion == "success")] + [.[] | select(.status != "completed")]
               + [.[] | select(.conclusion != "cancelled")] + .)[0].databaseId // empty'
          }
          id=$(pick)
          if [ -z "$id" ]; then
            echo "No CI run for dev ${sha:0:7} — starting one"
            gh workflow run ci.yml --ref dev
            for _ in $(seq 20); do
              sleep 6
              id=$(pick)
              [ -n "$id" ] && break
            done
            [ -n "$id" ] || { echo "::error::CI on dev did not start"; exit 1; }
          fi
          for _ in $(seq 5); do
            gh run watch "$id" >/dev/null || true
            conclusion=$(gh run view "$id" --json conclusion -q .conclusion)
            if [ "$conclusion" = success ]; then echo "CI on dev ${sha:0:7} is green ($id)"; exit 0; fi
            [ "$conclusion" = cancelled ] || break
            sleep 10
            next=$(pick)
            [ "$next" != "$id" ] || break
            echo "CI run $id was cancelled — waiting for run $next of the same commit"
            id=$next
          done
          echo "::error::CI on dev ${sha:0:7} is not green: $(gh run view "$id" --json url -q .url)"; exit 1

      # PR CI may skip Gradle for code the agent checked itself (Agent-Check: full), so the full check of this exact
      # dev commit is the nightly one (warm-cache.yml); none yet → run it now and wait (~6 min).
      - name: Nightly check on dev is green
        run: scripts/ci/nightly-green.sh "$(git rev-parse origin/dev)" --run

      - name: Release notes
        env:
          # The weekly run never waits for the owner to write a new section.
          ALLOW: ${{ inputs.allow_no_whats_new || github.event_name == 'schedule' }}
        run: |
          flag=(); [ "$ALLOW" = true ] && flag=(--allow-no-whats-new)
          python3 scripts/release_notes.py "${flag[@]}" > notes.txt || { code=$?
            [ $code -eq 2 ] && echo "::error::Top section of docs/whats-new.md is already released — add a new one in dev or tick «Выпустить без нового раздела»"
            exit 1; }
          head -1 notes.txt > title.txt
          tail -n +2 notes.txt > body.md
          cat notes.txt

      # Every feature brings its own story (#693, owner 2026-11-27; docs/agents/release-stories.md). They come with the feature PRs,
      # a Sunday-evening Claude task fills the gaps; still missing — no release: the weekly run opens a task, the button stops
      # (unless «Выпустить без новых историй»).
      - name: Release stories
        env:
          ALLOW: ${{ inputs.allow_no_stories || false }}
        run: |
          python3 scripts/release_stories.py check --base origin/main --head origin/dev > stories.txt && { cat stories.txt; exit 0; }
          cat stories.txt
          if [ "$ALLOW" = true ]; then echo "::warning::Release without the missing stories"; exit 0; fi
          echo "::error::Stories are not ready — ask the agent: python3 scripts/release_stories.py brief"
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            title="Релиз недели не вышел: нет историй"
            { echo "Еженедельный релиз остановлен: не все новые функции верхнего раздела \`docs/whats-new.md\` получили историю."
              echo; echo '```'; cat stories.txt; echo '```'
              echo; echo "Агенту: \`python3 scripts/release_stories.py brief\`, правила — \`docs/agents/release-stories.md\`; после мержа — кнопка релиза."
              echo; echo "Прогон: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; } > issue.md
            num=$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[0].number // empty')
            if [ -n "$num" ]; then gh issue comment "$num" --body-file issue.md
            else gh issue create --title "$title" --label status:next --label area:delivery --body-file issue.md; fi
          fi
          exit 1

      - name: Release PR
        id: pr
        run: |
          num=$(gh pr list --base main --head dev --state open --json number -q '.[0].number')
          if [ -n "$num" ]; then
            gh pr edit "$num" --title "$(cat title.txt)" --body-file body.md
          else
            gh pr create --base main --head dev --title "$(cat title.txt)" --body-file body.md
            num=$(gh pr list --base main --head dev --state open --json number -q '.[0].number')
          fi
          url=$(gh pr view "$num" --json url -q .url)
          echo "num=$num" >> "$GITHUB_OUTPUT"
          echo "Release PR: $url" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Merge and publish
        if: ${{ !inputs.pr_only }}
        env:
          NUM: ${{ steps.pr.outputs.num }}
        run: |
          if ! gh pr merge "$NUM" --merge --match-head-commit "$(git rev-parse origin/dev)"; then
            echo "::warning::Could not merge (branch protection?) — merge the PR by hand; CI publishes on the merge"
            exit 0
          fi
          gh workflow run ci.yml --ref main
          echo "Merged; CI on main publishes the build: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/ci.yml" \
            | tee -a "$GITHUB_STEP_SUMMARY"
